<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: cdn.jsdelivr.net cdnjs.cloudflare.com www.gstatic.com static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data: blob: https://zaanslicht-updates.ntxzjzzg8m.workers.dev; connect-src 'self' https://zaanslicht-updates.ntxzjzzg8m.workers.dev https://zaanslicht-0001-default-rtdb.europe-west1.firebasedatabase.app wss://zaanslicht-0001-default-rtdb.europe-west1.firebasedatabase.app https://static.cloudflareinsights.com https://cloudflareinsights.com https://formspree.io; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotograaf Portal — Zaans Licht</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:  #FF6B00;
    --black:   #080808;
    --s1:      #111;
    --s2:      #181818;
    --border:  rgba(255,255,255,0.08);
    --text:    #F0F0F0;
    --muted:   #666;
    --font:    'Segoe UI', system-ui, sans-serif;
    --mono:    'Courier New', monospace;
    --radius:  12px;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: pageFadeIn 0.22s ease;
  }
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font); cursor: pointer; }

  /* ── HEADER ── */
  html { overflow-x: clip; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,8,0.95);
    position: sticky; top: 0; z-index: 100; gap: 1rem; min-width: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 1.1rem; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
    flex-shrink: 0;
  }
  .logo-img { display:inline-block; width:32px; height:32px; flex-shrink:0; background-color:var(--accent,#FF6B00); -webkit-mask:url('images/logo-oranje.png') center/contain no-repeat; mask:url('images/logo-oranje.png') center/contain no-repeat; transition:background-color .4s ease; vertical-align:middle; }
  .logo span { color: var(--accent); }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .card {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 520px;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.6rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .card-label::before {
    content: ''; display: block;
    width: 16px; height: 1px;
    background: var(--accent);
  }

  .card h2 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.4rem;
  }

  .card-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  /* ── TOOLTIP HELP ── */
  .help-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .help-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted); font-size: 0.65rem; font-weight: 700;
    cursor: default; flex-shrink: 0; margin-left: 0.4rem;
    line-height: 1;
    transition: background 0.15s;
  }
  .help-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .help-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    background: #1e1e1e;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-size: 0.75rem; font-weight: 400; text-transform: none;
    line-height: 1.5; letter-spacing: 0;
    color: #ccc;
    width: 220px; max-width: 90vw;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 100;
    pointer-events: none;
    white-space: normal;
  }
  .help-tip::after {
    content: '';
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #1e1e1e;
  }
  .help-wrap:hover .help-tip { display: block; }

  /* Label rij met help knop */
  .label-row {
    display: flex; align-items: center; gap: 0;
  }

  /* ── HANDLEIDING ── */
  .handleiding {
    background: rgba(255,107,0,0.06);
    border: 1px solid rgba(255,107,0,0.2);
    border-radius: 10px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .handleiding-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.2rem; cursor: pointer;
    font-size: 0.85rem; font-weight: 600; color: var(--accent);
  }
  .handleiding-header:hover { background: rgba(255,107,0,0.04); }
  .handleiding-header span { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
  .handleiding-body {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid rgba(255,107,0,0.15);
  }
  .handleiding-body.open { display: block; }
  .handleiding-stap {
    display: flex; gap: 0.8rem; align-items: flex-start;
    padding: 0.7rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.82rem; color: #bbb; line-height: 1.5;
  }
  .handleiding-stap:last-child { border-bottom: none; }
  .handleiding-nr {
    background: var(--accent); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
    margin-top: 0.1rem;
  }

  /* ── FORM ── */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }

  label {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(240,240,240,0.7);
    text-transform: uppercase;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="color"] {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 0.75rem 1rem;
    font-family: var(--font);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 0.85rem;
    border-radius: var(--radius);
    border: none;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #ff8c33; transform: translateY(-1px); }
  .btn-primary:disabled { background: #333; color: var(--muted); transform: none; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .feedback {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-radius: var(--radius);
    font-size: 0.85rem;
    display: none;
  }
  .feedback.ok  { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; display: block; }
  .feedback.err { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; display: block; }
  .feedback.waarschuwing { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); color: #fbbf24; display: block; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(255,107,0,0.04);
  }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .upload-zone .uz-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .upload-zone .uz-titel {
    font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem;
  }
  .upload-zone .uz-sub { font-size: 0.8rem; color: var(--muted); }

  /* ── UPLOAD QUEUE ── */
  .upload-queue {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 280px;
    overflow-y: auto;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.82rem;
  }
  .queue-item img {
    width: 44px; height: 44px;
    object-fit: cover; border-radius: 6px;
    flex-shrink: 0;
  }
  .queue-naam { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-size { color: var(--muted); flex-shrink: 0; font-family: var(--mono); font-size: 0.72rem; }
  .queue-status { flex-shrink: 0; font-size: 0.75rem; }
  .queue-status.wacht { color: var(--muted); }
  .queue-status.bezig { color: #fbbf24; }
  .queue-status.ok    { color: #4ade80; }
  .queue-status.fout  { color: #f87171; }

  /* ── KLEUR PICKER ── */
  .kleur-row {
    display: flex; align-items: center; gap: 0.8rem;
    margin-bottom: 1rem;
  }
  .kleur-row input[type="color"] {
    width: 48px; height: 48px;
    padding: 0.2rem;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .kleur-label { font-size: 0.82rem; color: var(--muted); }

  /* ── DASHBOARD (na inlog) ── */
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
    flex-wrap: wrap; gap: 0.8rem;
  }
  .dash-naam {
    font-size: 1.4rem; font-weight: 700;
  }
  .dash-badge {
    font-size: 0.72rem; font-family: var(--mono);
    letter-spacing: 1px; text-transform: uppercase;
    padding: 0.25rem 0.7rem; border-radius: 100px;
    border: 1px solid var(--border); color: var(--muted);
  }

  .tabs {
    display: flex; gap: 0.3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    background: none; border: none;
    color: var(--muted); font-size: 0.82rem;
    font-weight: 600; letter-spacing: 0.5px;
    padding: 0.6rem 1rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── VOLGORDE LIJST ── */
  .map-item {
    background: var(--s2); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; margin-bottom: 0.6rem;
    overflow: hidden; transition: border-color 0.15s;
  }
  .map-item:hover { border-color: rgba(255,255,255,0.15); }
  .map-item.leeg { border-color: rgba(239,68,68,0.3); }
  .map-item.sortable-ghost { opacity: 0.4; }
  .map-item.sortable-chosen { box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .map-header {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.7rem 1rem; cursor: default; flex-wrap: wrap;
  }
  .map-controls {
    display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
  }
  .map-thumb {
    width: 52px; height: 36px; border-radius: 4px;
    object-fit: cover; flex-shrink: 0; background: #111;
  }
  .map-thumb-leeg {
    width: 52px; height: 36px; border-radius: 4px; flex-shrink: 0;
    background: #1a1a1a; border: 1px dashed #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .map-drag-handle {
    color: var(--muted); font-size: 1.1rem; cursor: grab;
    padding: 0 0.2rem; user-select: none; flex-shrink: 0;
  }
  .map-drag-handle:active { cursor: grabbing; }
  .map-info { flex: 1; min-width: 0; }
  .map-naam { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
  .map-cat-badge {
    font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
    padding: 0.2rem 0.55rem; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.1); color: var(--muted); flex-shrink: 0;
  }
  .map-expand-btn {
    background: none; border: none; color: #fff; cursor: pointer;
    padding: 0.3rem 0.45rem; transition: color 0.15s;
    flex-shrink: 0; display: inline-flex; align-items: center;
  }
  .map-expand-btn:hover, .map-expand-btn.open { color: var(--accent); }
  .map-fotos-paneel {
    display: none; border-top: 1px solid rgba(255,255,255,0.06);
    padding: 0.8rem 1rem; background: #0f0f0f;
  }
  .map-fotos-grid {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.8rem;
  }
  .foto-chip {
    position: relative; width: 72px; height: 52px; border-radius: 4px;
    overflow: visible; cursor: pointer; flex-shrink: 0;
    border: 2px solid transparent; transition: border-color 0.15s;
  }
  .foto-chip-img { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; }
  .foto-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 🗑 en 🏷 zijn altijd zichtbare kleine badges (geen volledige overlay meer over
     de foto — dat maakte de foto onzichtbaar zolang je 'm zag). Wit in rust; 🗑
     kleurt rood bij aanwijzen (verwijderen = gevaar), 🏷 kleurt in de accentkleur
     van de fotograaf. */
  .foto-chip-del {
    position: absolute; bottom: -6px; left: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(30,30,30,0.9); border: 1.5px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; cursor: pointer; z-index: 20;
    transition: background-color 0.15s, border-color 0.15s; color: #fff; line-height: 1;
  }
  .foto-chip-del:hover { background: #ef4444; border-color: #ef4444; }
  .foto-chip-lbl {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(30,30,30,0.9); border: 1.5px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; cursor: pointer; z-index: 20;
    transition: background-color 0.15s, border-color 0.15s; color: #fff; line-height: 1;
  }
  .foto-chip-lbl:hover { background: var(--accent); border-color: var(--accent); }
  .foto-chip-lbl.heeft-labels { background: var(--accent); color: #fff; border-color: var(--bg); }
  /* Sorteer-modus: overlays uit zodat tikken/slepen de foto zelf raakt */
  .map-item.sorteer-modus .foto-chip-del,
  .map-item.sorteer-modus .foto-chip-lbl,
  .map-item.sorteer-modus .foto-chip-check { display: none !important; }
  .map-item.sorteer-modus .foto-chip { cursor: grab; }
  .foto-chip.sorteer-geselecteerd {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,107,0,0.45);
    transform: scale(1.08); z-index: 10;
  }
  .foto-label-popup {
    position: fixed; z-index: 200; background: var(--s2);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 0.7rem; min-width: 220px; max-width: 280px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  .foto-label-popup-titel {
    font-size: 0.72rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 0.5rem;
  }
  .foto-label-popup-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .foto-label-popup-chip {
    font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15); color: #ccc;
    cursor: pointer; transition: all 0.12s; background: transparent;
  }
  .foto-label-popup-chip:hover { border-color: var(--accent); color: var(--accent); }
  .foto-label-popup-chip.aan { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .foto-label-popup-chip.gemixt {
    background: repeating-linear-gradient(135deg, rgba(255,107,0,0.28) 0 6px, rgba(255,107,0,0.12) 6px 12px);
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .foto-label-popup-count { opacity: 0.75; font-weight: 400; font-size: 0.65rem; }
  .foto-label-popup-uitleg { font-size: 0.68rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.4; }
  .foto-label-popup-acties { display: flex; gap: 0.5rem; margin-top: 0.7rem; justify-content: flex-end; }
  .foto-label-popup-btn {
    font-size: 0.75rem; padding: 0.35rem 0.9rem; border-radius: 6px;
    cursor: pointer; font-family: inherit; transition: all 0.12s;
  }
  .foto-label-popup-annuleer { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #aaa; }
  .foto-label-popup-annuleer:hover { border-color: #888; color: #ddd; }
  .foto-label-popup-opslaan { background: var(--accent); border: 1px solid var(--accent); color: #fff; font-weight: 700; }
  .foto-label-popup-opslaan:hover { background: #e56000; }
  .foto-label-popup-opslaan:disabled { opacity: 0.6; cursor: wait; }
  html.light-mode .foto-label-popup-annuleer { border-color: rgba(0,0,0,0.25); color: #555; }
  .foto-label-popup-sluiten {
    margin-top: 0.5rem; font-size: 0.7rem; color: var(--muted);
    text-align: right; cursor: pointer;
  }
  .foto-label-popup-sluiten:hover { color: var(--text); }
  .map-verwijder-btn {
    background: none; border: 1px solid rgba(239,68,68,0.4); color: #ef4444;
    border-radius: 6px; padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer;
    transition: all 0.15s;
  }
  .map-verwijder-btn:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }
  .map-verberg-btn {
    background: none; border: 1px solid #444; color: #888;
    border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.75rem; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .map-verberg-btn:hover { border-color: #aaa; color: #ccc; }
  .map-verberg-btn.verborgen { border-color: #FF6B00; color: #FF6B00; }
  .map-verberg-btn.verborgen:hover { background: rgba(255,107,0,0.1); }
  .verborgen-serie .map-naam { opacity: 0.5; }
  .verborgen-serie .map-meta::after { content: ' · verborgen voor bezoekers'; color: #FF6B00; font-style: italic; }

  /* Bulk selectie */
  .map-checkbox {
    width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0;
  }
  .map-item.geselecteerd { border-color: var(--accent) !important; background: rgba(255,107,0,0.06); }
  .groep-selecteer-btn {
    background: none; border: 1px solid #444; color: #888; border-radius: 5px;
    padding: 0.2rem 0.6rem; font-size: 0.72rem; cursor: pointer; transition: all 0.15s;
  }
  .groep-selecteer-btn:hover { border-color: #aaa; color: #ccc; }
  .foto-chip-check {
    position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
    z-index: 25; accent-color: var(--accent); cursor: pointer;
    opacity: 0; transition: opacity 0.15s;
  }
  .foto-chip:hover .foto-chip-check,
  .foto-chip.geselecteerd .foto-chip-check { opacity: 1; }
  .foto-chip.geselecteerd { border-color: var(--accent); }
  #fg-bulk-balk {
    position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1c;
    border-top: 2px solid var(--accent); padding: 0.8rem 1.5rem;
    display: none; align-items: center; gap: 0.75rem; z-index: 400;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
  #fg-bulk-balk.actief { display: flex; }
  .bulk-btn {
    background: none; border: 1px solid #555; color: #ccc;
    border-radius: 6px; padding: 0.45rem 1rem; font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .bulk-btn:hover { border-color: #aaa; color: #fff; }
  .bulk-btn.bulk-verwijder { border-color: rgba(239,68,68,0.5); color: #ef4444; }
  .bulk-btn.bulk-verwijder:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }
  .bulk-btn.bulk-verberg { border-color: var(--accent); color: var(--accent); }
  .bulk-btn.bulk-annuleer { border-color: #333; color: #666; }

  /* GROEPEN */
  .map-groep { margin-bottom: 1.5rem; }
  .map-groep-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); padding: 0 0.2rem 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 0.6rem;
  }
  .map-groep-teller { font-weight: 400; }
  .map-groep-lijst { min-height: 2rem; }
  .map-cat-knoppen {
    display: flex; align-items: center; flex-shrink: 0;
  }
  .map-cat-btn {
    background: none; border: 1px solid rgba(255,255,255,0.12); color: var(--muted);
    padding: 0.28rem 0.6rem; font-size: 0.72rem; cursor: pointer;
    transition: all 0.15s; white-space: nowrap; font-family: var(--font);
  }
  .map-cat-btn:first-child { border-radius: 6px 0 0 6px; }
  .map-cat-btn:last-child  { border-radius: 0 6px 6px 0; }
  .map-cat-btn:not(:first-child) { border-left: none; }
  .map-cat-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); z-index: 1; position: relative; }
  .map-cat-btn.actief {
    background: rgba(255,107,0,0.15); border-color: var(--accent);
    color: var(--accent); font-weight: 600; z-index: 1; position: relative;
  }
  .map-cat-btn.actief + .map-cat-btn { border-left: none; }

  /* LABELS */
  .label-chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.25rem 0.65rem; border-radius: 100px; font-size: 0.78rem;
    border: 1px solid rgba(255,255,255,0.15); color: var(--muted);
    background: var(--s2); cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .label-chip:hover { border-color: var(--accent); color: var(--accent); }
  .label-chip.actief { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* POSITIE TAB */
  .positie-groep { margin-bottom: 1.5rem; }
  .positie-groep-header {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;

  .positie-item.eigen { border-left: 3px solid var(--accent); cursor: default; }
  .positie-item.ander { opacity: 0.45; cursor: not-allowed; }
  .positie-item .drag-handle { color: var(--muted); font-size: 1.1rem; cursor: grab; user-select: none; flex-shrink: 0; }
  .positie-item.ander .drag-handle { display: none; }
  .positie-naam { flex: 1; font-size: 0.88rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .positie-meta { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }

  /* ── MAPPEN OVERZICHT ── */
  .mappen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .map-card {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .map-card:hover { border-color: var(--accent); }
  .map-card .mc-icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
  .map-card .mc-naam { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-card .mc-cat  { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; }

  /* ── UITLOGGEN ── */
  .logout-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 0.35rem 0.9rem;
    border-radius: 8px; font-size: 0.78rem; transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

  /* Kop-knoppen (thema, handleiding, terug naar site): gebruikten voorheen
     hardcoded #FF6B00 i.p.v. de accentkleur van de fotograaf — nu var(--accent). */
  .header-btn {
    background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--muted);
    font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 100px;
    cursor: pointer; transition: color 0.2s, border-color 0.2s; display: inline-flex; align-items: center;
  }
  .header-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 0.55rem 0.9rem; gap: 0.6rem; }
    .logo { font-size: 0.9rem; gap: 0.35rem; }
    .logo-img { width: 26px; height: 26px; }
    /* rechter header-links: compacter */
    header > div { gap: 0.5rem !important; }
    header a, header button { font-size: 0.68rem !important; padding: 0.25rem 0.5rem !important; }
    main { padding: 0.75rem; }
    .card { padding: 1rem; }

    /* Tabs: scrollbaar */
    .tabs {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; gap: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { white-space: nowrap; flex-shrink: 0; padding: 0.6rem 0.7rem; font-size: 0.72rem; }

    /* Map-rij: stapelen */
    .map-rij-flex { flex-direction: column !important; }

    /* Dash header */
    .dash-header { margin-bottom: 1rem; }
    .dash-naam { font-size: 1rem; }

    /* Upload zone: compacter */
    .upload-zone { padding: 1.2rem 0.8rem; }

    /* Mappen acties */
    #mappen-acties { flex-direction: column; align-items: stretch !important; }

    /* Map-header: controls naar tweede rij */
    .map-controls { width: 100%; flex-wrap: wrap; }
    .map-cat-knoppen { flex: 1; }
    .map-cat-btn { flex: 1; justify-content: center; }
    .map-datum-input { width: 110px; }
  }

  /* ── LIGHT MODE ─────────────────────────────────────────────────────── */
  html.light-mode {
    --accent: #FF6B00; --black: #f4f4f4; --s1: #ffffff; --s2: #f0f0f0;
    --border: rgba(0,0,0,0.1); --text: #111111; --muted: #555555;
    background: #f4f4f4;
  }
  html.light-mode body { background: #f4f4f4; color: #111; }
  html.light-mode header { background: rgba(244,244,244,0.95); border-bottom-color: rgba(0,0,0,0.1); }
  html.light-mode .card { background: #fff; border-color: rgba(0,0,0,0.1); }
  html.light-mode .logout-btn { border-color: #ddd; color: #555; }
  html.light-mode .map-expand-btn { color: #111; }
  html.light-mode .map-expand-btn:hover, html.light-mode .map-expand-btn.open { color: var(--accent); }
  html.light-mode .logout-btn:hover { border-color: #ef4444; color: #ef4444; }
  html.light-mode .upload-zone { border-color: rgba(255,107,0,0.3); }
  html.light-mode .upload-zone.dragover { background: rgba(255,107,0,0.06); }
  html.light-mode .dash-header { border-bottom-color: #e0e0e0; }
  html.light-mode .tab-bar { border-bottom-color: #e0e0e0; }
  html.light-mode .tab-btn { color: #555; }
  html.light-mode .tab-btn.active { color: var(--accent); }
  html.light-mode .map-header { border-bottom-color: #e0e0e0; background: #fff; }
  html.light-mode .map-header:hover { background: #f8f8f8; }
  html.light-mode .map-groep-header { background: #f0f0f0; border-color: #e0e0e0; }
  html.light-mode .positie-groep-header { background: #f0f0f0; border-color: #e0e0e0; }
  html.light-mode input, html.light-mode textarea, html.light-mode select {
    background: #fff !important; border-color: #ddd !important; color: #111 !important; color-scheme: light !important;
  }
  /* Override inline achtergrond-kleuren */
  html.light-mode [style*="background:#080808"],
  html.light-mode [style*="background: #080808"] { background: #f4f4f4 !important; }
  html.light-mode [style*="background:#111"],
  html.light-mode [style*="background: #111"] { background: #fff !important; }

  html.light-mode [style*="background: #1a1a1a"] { background: #fff !important; }
  html.light-mode [style*="background:#222"],
  html.light-mode [style*="background: #222"] { background: #ebebeb !important; }
  html.light-mode [style*="background:#0d0d0d"],
  html.light-mode [style*="background: #0d0d0d"] { background: #f4f4f4 !important; }
  html.light-mode .foto-label-popup { background: #fff; border-color: rgba(0,0,0,0.15); box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
  html.light-mode .foto-label-popup-chip { color: #444; border-color: rgba(0,0,0,0.2); }
  html.light-mode .foto-label-popup-chip.aan { color: #fff; }
  html.light-mode .foto-label-popup-chip.gemixt { color: #b35400; }
  /* Override inline tekstkleuren */
  html.light-mode [style*="color:#F0F0F0"],
  html.light-mode [style*="color:#f0f0f0"] { color: #111 !important; }
  html.light-mode [style*="color:#eee"] { color: #111 !important; }
  html.light-mode [style*="color:#ddd"] { color: #222 !important; }
  html.light-mode [style*="color:#ccc"] { color: #333 !important; }
  html.light-mode [style*="color:#aaa"] { color: #555 !important; }
  html.light-mode [style*="color:#888"] { color: #555 !important; }

  /* Override inline randen */
  html.light-mode [style*="border:1px solid rgba(255,255,255,0.08)"],
  html.light-mode [style*="border: 1px solid rgba(255,255,255,0.08)"] { border-color: rgba(0,0,0,0.1) !important; }
  html.light-mode [style*="border:1px solid rgba(255,255,255,0.06)"],
  html.light-mode [style*="border: 1px solid rgba(255,255,255,0.06)"] { border-color: rgba(0,0,0,0.08) !important; }
  html.light-mode [style*="border:1px solid rgba(255,255,255,0.1)"],
  html.light-mode [style*="border: 1px solid rgba(255,255,255,0.1)"] { border-color: rgba(0,0,0,0.12) !important; }
  html.light-mode [style*="border:1px solid #333"],
  html.light-mode [style*="border: 1px solid #333"] { border-color: #ddd !important; }
  html.light-mode [style*="border-bottom:1px solid rgba(255,255,255,0.08)"],

<script>if(localStorage.getItem('zl_theme')==='light')document.documentElement.classList.add('light-mode');</script>
<script src="firebase-rest.js"></script>
<body>

<header>
  <div class="logo">
    <span class="logo-img" aria-label="Zaans Licht logo" role="img"></span>
    Zaans<span> Licht</span>
  </div>
  <div style="display:flex;align-items:center;gap:0.8rem">
    <button id="btn-theme" class="header-btn" onclick="toggleTheme()" title="Wissel achtergrond" style="font-size:1rem;padding:0.25rem 0.55rem;line-height:1">☀️</button>
    <a href="fotograaf-handleiding.html" target="_blank" class="header-btn" style="text-decoration:none">❓ Handleiding</a>
    <a href="index.html" class="header-btn" style="text-decoration:none">← Terug naar site</a>
  </div>
</header>

<main id="main-content">
  <!-- Wordt ingevuld door JavaScript -->
  <div class="card">
    <p style="color:var(--muted);text-align:center;font-family:var(--mono);font-size:0.85rem">Laden…</p>
  </div>
</main>

<script>
const WORKER = 'https://zaanslicht-updates.ntxzjzzg8m.workers.dev';

// Versie van deze pagina. BUMP DEZE bij elke echte wijziging aan fotograaf.html
// (datum + letter). De versiecheck onderaan vergelijkt 'm met de live versie en
// waarschuwt de fotograaf als zijn tabblad verouderde code draait — dat gebeurt
// vaak, want het portaal blijft dagenlang open staan (zie checkNieuweVersie).
const APP_VERSIE = '2026-07-17-b';

function toggleTheme() {
  const light = document.documentElement.classList.toggle('light-mode');
  localStorage.setItem('zl_theme', light ? 'light' : 'dark');
  const btn = document.getElementById('btn-theme');
  if (btn) btn.textContent = light ? '🌙' : '☀️';
}
(function() {
  const btn = document.getElementById('btn-theme');
  if (btn && document.documentElement.classList.contains('light-mode')) btn.textContent = '🌙';
})();
const params = new URLSearchParams(window.location.search);
const inviteToken = params.get('invite');

// ── Laad opgeslagen sessie ────────────────────────────────────────────────
let sessie = JSON.parse(localStorage.getItem('zl_fotograaf') || 'null');
function haalSessieOp() { return sessie; }

function sessieVerlopen() {
  localStorage.removeItem('zl_fotograaf');
  sessie = null;
  window.scrollTo(0, 0);
  toonInloggen('Je sessie is verlopen. Log opnieuw in om verder te gaan.');
}

// Controleert bij het laden of het opgeslagen token nog geldig is.
// Alleen een expliciete 401 logt uit — bij netwerkfouten blijft de sessie staan.
async function controleerSessie() {
  try {
    const r = await fetch(WORKER + '/fotograaf/verborgen-eigen', { headers: { 'X-Fotograaf-Token': sessie.token } });
    return r.status !== 401;
  } catch { return true; }
}

// ── REALTIME PRESENCE (via firebase-rest.js — géén live SDK-verbinding, zie ─
// firebase-rest.js voor waarom: die hangt/faalt stil op de live site) ───────
let _presInterval = null;

async function startPresence() {
  if (_presInterval || !sessie?.id) return;
  const heartbeat = () => fbSet('online/' + sessie.id, {
    naam: sessie.naam,
    kleur: sessie.kleur || '#FF6B00',
    sinds: Date.now(),
  }).catch(() => {});
  heartbeat();
  _presInterval = setInterval(heartbeat, 20000);
}

async function stopPresence() {
  if (_presInterval) { clearInterval(_presInterval); _presInterval = null; }
  if (sessie?.id) await fbDelete('online/' + sessie.id).catch(() => {});
}

// ── VERSIECHECK ───────────────────────────────────────────────────────────────
// Het fotografenportaal blijft bij fotografen vaak dagenlang in een openstaand
// tabblad draaien. Ze klikken dan tussen de tabs (dat herlaadt data van de Worker),
// maar herladen de pagina zélf nooit — dus draaien ze oude JS en melden ze bugs die
// allang gefixt zijn. Deze check haalt de live pagina op, leest de APP_VERSIE eruit
// en toont een vernieuw-balk als die afwijkt van de versie die nu draait.
let _versieBannerGetoond = false;
let _laatsteVersieCheck   = 0;

async function checkNieuweVersie() {
  if (_versieBannerGetoond) return;
  try {
    // Wegwerp-query + no-store: nooit de echte ?v=-cachesleutel vervuilen (zie
    // deploy-notities). HTML is toch DYNAMIC bij Cloudflare, dus geen cache-druk.
    const res = await fetch('fotograaf.html?vc=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/APP_VERSIE\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1] && m[1] !== APP_VERSIE) toonVersieBanner();
  } catch { /* offline / netwerkfout — stil negeren, gewoon later opnieuw proberen */ }
}

function toonVersieBanner() {
  if (_versieBannerGetoond) return;
  _versieBannerGetoond = true;
  const b = document.createElement('div');
  b.id = 'versie-banner';
  b.style.cssText = 'position:sticky;top:0;z-index:600;background:#166534;border-bottom:2px solid #22c55e;color:#fff;padding:0.7rem 1rem;display:flex;align-items:center;justify-content:center;gap:0.6rem;font-size:0.85rem;font-weight:700;cursor:pointer;text-align:center';
  b.innerHTML = '🔄 Er is een nieuwere versie van deze pagina. <u>Klik hier om te vernieuwen</u>';
  b.onclick = () => location.reload();
  document.body.prepend(b);
}

// Bij laden even wachten (login/dashboard eerst laten renderen), en daarna telkens
// als het tabblad weer zichtbaar wordt — hooguit 1× per 3 minuten.
function misschienVersieCheck() {
  const nu = Date.now();
  if (nu - _laatsteVersieCheck < 180000) return;
  _laatsteVersieCheck = nu;
  checkNieuweVersie();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) misschienVersieCheck(); });

window.addEventListener('DOMContentLoaded', async () => {
  setTimeout(misschienVersieCheck, 3000);
  if (sessie?.token) {
    if (!(await controleerSessie())) { sessieVerlopen(); return; }
    toonDashboard();
    checkPositieBeheer();
    toonReviewBanner();
  } else if (inviteToken) {
    toonRegistreren();
  } else {
    toonInloggen();
  }
});

// ── Review-banner: admin kijkt mee via beheer.html ────────────────────────
function toonReviewBanner() {
  if (localStorage.getItem('zl_review') !== '1') return;
  const banner = document.createElement('div');
  banner.style.cssText = 'position:sticky;top:0;z-index:500;background:#7c2d12;border-bottom:2px solid #FF6B00;color:#fff;padding:0.6rem 1rem;display:flex;align-items:center;justify-content:center;gap:0.8rem;font-size:0.82rem;font-weight:600';
  banner.innerHTML = `
    <span>👁 Review-modus — je kijkt mee als <strong>${sessie.naam}</strong>. Wijzigingen zijn écht.</span>
    <button onclick="stopReview()" style="background:#FF6B00;border:none;color:#fff;padding:0.3rem 0.9rem;border-radius:6px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit">Stop review</button>`;
  document.body.prepend(banner);
}

window.stopReview = () => {
  localStorage.removeItem('zl_fotograaf');
  localStorage.removeItem('zl_review');
  window.close();
  // Als het tabblad niet door script geopend was, val terug op beheer
  setTimeout(() => { location.href = 'beheer.html'; }, 200);
};

// ══════════════════════════════════════════════════════
// INLOGGEN
// ══════════════════════════════════════════════════════
function toonInloggen(melding) {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <p class="card-label">Fotograaf Portal</p>
      <h2>Inloggen</h2>
      ${melding ? `<p style="background:rgba(255,107,0,0.1);border:1px solid rgba(255,107,0,0.4);border-radius:var(--radius);padding:0.7rem 1rem;font-size:0.85rem;color:#FF6B00;margin-bottom:1rem">${melding}</p>` : ''}
      <p class="card-sub">Log in met je e-mailadres en wachtwoord om foto's te uploaden.</p>
      <form id="login-form">
        <div class="form-group">
          <label>E-mailadres</label>
          <input type="email" id="login-email" placeholder="jouw@email.nl" required />
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" id="login-pw" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Inloggen →</button>
      </form>
      <div id="login-feedback" class="feedback"></div>
    </div>`;

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Bezig…';
    const fb = document.getElementById('login-feedback');
    fb.className = 'feedback';

    try {
      const res  = await fetch(WORKER + '/fotograaf/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-pw').value,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Inloggen mislukt');
      sessie = { token: data.token, naam: data.naam, kleur: data.kleur, id: data.id };
      localStorage.setItem('zl_fotograaf', JSON.stringify(sessie));
      toonDashboard();
    } catch(err) {
      fb.textContent = err.message; fb.className = 'feedback err';
      btn.disabled = false; btn.textContent = 'Inloggen →';
    }
  });
}

function toonRegistreren() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <p class="card-label">Welkom bij Zaans Licht</p>
      <h2>Account aanmaken</h2>
      <p class="card-sub">Je bent uitgenodigd om foto's te delen op Zaans Licht. Kies een wachtwoord en je accentkleur.</p>
      <form id="register-form">
        <div class="form-group">
          <div class="label-row">
            <label>Wachtwoord</label>
            <div class="help-wrap">
              <span class="help-btn">?</span>
              <div class="help-tip">Kies een wachtwoord van minimaal 8 tekens. Onthoud het goed — je hebt het nodig om later in te loggen.</div>
            </div>
          </div>
          <input type="password" id="reg-pw" placeholder="Minimaal 8 tekens" minlength="8" required />
        </div>
        <div class="form-group">
          <label>Herhaal wachtwoord</label>
          <input type="password" id="reg-pw2" placeholder="••••••••" required />
        </div>
        <div class="form-group">
          <div class="label-row">
            <label>Jouw accentkleur</label>
            <div class="help-wrap">
              <span class="help-btn">?</span>
              <div class="help-tip">Deze kleur wordt als accent gebruikt bij jouw foto's op de site. Je kunt hem later altijd aanpassen via Instellingen.</div>
            </div>
          </div>
          <div class="kleur-row">
            <input type="color" id="reg-kleur" value="#3b82f6" />
            <span class="kleur-label">Wordt gebruikt als kleur voor jouw foto's op de site</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Account aanmaken →</button>
      </form>
      <div id="reg-feedback" class="feedback"></div>
    </div>`;

  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const fb  = document.getElementById('reg-feedback');
    const pw  = document.getElementById('reg-pw').value;
    const pw2 = document.getElementById('reg-pw2').value;

    if (pw !== pw2) { fb.textContent = 'Wachtwoorden komen niet overeen.'; fb.className = 'feedback err'; return; }

    btn.disabled = true; btn.textContent = 'Bezig…';
    fb.className = 'feedback';

    try {
      const res  = await fetch(WORKER + '/fotograaf/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inviteToken, password: pw,
          kleur: document.getElementById('reg-kleur').value,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Registratie mislukt');
      sessie = { token: data.token, naam: data.naam, kleur: data.kleur, id: data.id };
      localStorage.setItem('zl_fotograaf', JSON.stringify(sessie));
      history.replaceState(null, '', '/fotograaf.html');
      toonDashboard(true);
    } catch(err) {
      fb.textContent = err.message; fb.className = 'feedback err';
      btn.disabled = false; btn.textContent = 'Account aanmaken →';
    }
  });
}

  startPresence();

  // Upload zone drag & drop
  const zone  = document.getElementById('upload-zone');
  const input = document.getElementById('file-input');
  let bestanden = [];

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    verwerkBestanden([...e.dataTransfer.files]);
  });
  input.addEventListener('change', () => verwerkBestanden([...input.files]));

  // RAW-extensies die de browser niet kan decoderen
  const RAW_EXT = new Set(['cr2','cr3','nef','arw','dng','orf','rw2','raf','pef','srw','raw','x3f','3fr','mef','nrw']);

  function isRaw(f) {
    const ext = f.name.split('.').pop().toLowerCase();
    return RAW_EXT.has(ext);
  }

  function isAlWebp(f) { return f.name.toLowerCase().endsWith('.webp'); }

  // Detecteer of deze browser WebP kan encoderen via Canvas.
  // Safari/iOS ondersteunt dit niet en valt anders stilzwijgend terug op PNG-data
  // terwijl het bestand toch .webp heet — de server verwerpt dat dan als "verkeerd formaat".
  let _webpEncodeOndersteund = null;
  function canvasKanWebp() {
    if (_webpEncodeOndersteund === null) {
      const c = document.createElement('canvas');
      c.width = c.height = 1;
      _webpEncodeOndersteund = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
    }
    return _webpEncodeOndersteund;
  }

  function verwerkBestanden(files) {
    const raws = files.filter(isRaw);
    if (raws.length) {
      const namen = raws.map(f => f.name).join(', ');
      alert(`RAW-bestanden worden niet ondersteund:\n${namen}\n\nExporteer eerst naar JPEG vanuit Lightroom, Camera Raw of een vergelijkbaar programma.`);
    }
    const toegestaan = files.filter(f => !isRaw(f) && f.type.startsWith('image/') && f.size <= 15*1024*1024);
    bestanden = [...bestanden, ...toegestaan];
    toonQueue();
  }

  function toonQueue() {
    const queue = document.getElementById('upload-queue');
    const btn   = document.getElementById('upload-btn');
    queue.innerHTML = bestanden.map((f, i) => {
      const webp = isAlWebp(f);
      const doel = canvasKanWebp() ? 'WebP' : 'JPEG';
      const tag  = webp ? '' : `<span style="font-size:0.65rem;background:rgba(255,107,0,0.2);color:var(--accent);border-radius:4px;padding:0.1rem 0.4rem;flex-shrink:0">→ ${doel}</span>`;
      return `<div class="queue-item" id="qi-${i}">
        <div style="font-size:1.2rem">${webp ? '🌐' : '🖼️'}</div>
        <span class="queue-naam">${f.name}</span>
        ${tag}
        <span class="queue-size">${(f.size/1024/1024).toFixed(1)} MB</span>
        <span class="queue-status wacht" id="qs-${i}">Wacht</span>
      </div>`;
    }).join('');
    btn.style.display = bestanden.length ? '' : 'none';
  }

  // Zet een afbeelding om naar WebP via Canvas; geeft { foto, thumbnail } terug.
  // Op browsers die geen WebP-encoding ondersteunen (Safari/iOS) wordt JPEG gebruikt.
  async function converteerNaarWebp(file) {
    const kanWebp = canvasKanWebp();
    const uitvoerType = kanWebp ? 'image/webp' : 'image/jpeg';
    const ext         = kanWebp ? '.webp' : '.jpg';
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        // Hoofdfoto (max 2200px breed, kwaliteit 88)
        const MAX_W = 2200;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        // Thumbnail (max 400px breed, kwaliteit 72)
        const TH_W = 400;
        let tw = w, th = h;
        if (tw > TH_W) { th = Math.round(th * TH_W / tw); tw = TH_W; }
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = tw; thumbCanvas.height = th;
        thumbCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
        URL.revokeObjectURL(url);

        const naam      = file.name.replace(/\.[^.]+$/, ext);
        const thumbNaam = file.name.replace(/\.[^.]+$/, '-thumb' + ext);
        canvas.toBlob(fotoBlob => {
          if (!fotoBlob) { reject(new Error('Conversie mislukt')); return; }
          thumbCanvas.toBlob(thumbBlob => {
            resolve({
              foto:      new File([fotoBlob],  naam,      { type: uitvoerType }),
              thumbnail: thumbBlob ? new File([thumbBlob], thumbNaam, { type: uitvoerType }) : null,
            });
          }, uitvoerType, 0.72);
        }, uitvoerType, kanWebp ? 0.88 : 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Afbeelding kon niet worden geladen')); };
      img.src = url;
    });
  }


window.startUpload = async () => {
    const btn  = document.getElementById('upload-btn');
    // Val terug op de dropdown-selectie als het tekstveld leeg is (bv. als de
    // synchronisatie om wat voor reden dan ook niet is gelopen) — voorkomt dat
    // een gekozen bestaande map ten onrechte als "geen mapnaam" wordt afgewezen.
    const map  = document.getElementById('up-map').value.trim() || document.getElementById('up-map-select')?.value.trim() || '';
    const cat  = 'voetbal';
    const fb   = document.getElementById('upload-feedback');

    // Wis eerst de vorige melding: anders blijft die staan als deze poging er zelf
    // geen zet, en leest de fotograaf hem als antwoord op de nieuwe klik.
    fb.textContent = ''; fb.innerHTML = ''; fb.className = 'feedback';

    if (!map) {
      fb.textContent = 'Kies hierboven een bestaande map of typ een naam voor een nieuwe map.';
      fb.className = 'feedback err'; return;
    }
    if (!bestanden.length) {
      fb.textContent = 'Kies eerst foto\'s: sleep ze in het vak of klik erop om ze te selecteren.';
      fb.className = 'feedback err'; return;
    }

    btn.disabled = true; btn.textContent = 'Bezig met uploaden…';

    let ok = 0, fout = 0;
    for (let i = 0; i < bestanden.length; i++) {
      const s = document.getElementById('qs-' + i);
      s.textContent = '⟳ Bezig'; s.className = 'queue-status bezig';

      let uploadFoto, uploadThumb = null;
      try {
        s.textContent = '⟳ Omzetten…'; s.className = 'queue-status bezig';
        const result = await converteerNaarWebp(bestanden[i]);
        uploadFoto  = result.foto;
        uploadThumb = result.thumbnail;
      } catch(convErr) {
        s.textContent = '✕ Kan niet omzetten'; s.className = 'queue-status fout'; fout++; continue;
      }

      const form = new FormData();
      form.append('foto', uploadFoto);
      if (uploadThumb) form.append('thumbnail', uploadThumb);
      form.append('map', map);
      form.append('categorie', cat);
      form.append('labels', JSON.stringify(_geselecteerdeLabels));

      try {
        const res  = await fetch(WORKER + '/fotograaf/upload', {
          method: 'POST',
          headers: { 'X-Fotograaf-Token': sessie.token },
          body: form,
        });
        const data = await res.json();
        if (data.ok) { s.textContent = '✓'; s.className = 'queue-status ok'; ok++; }
        else { s.textContent = '✕ ' + (data.error || 'fout'); s.className = 'queue-status fout'; fout++; }
      } catch {
        s.textContent = '✕ verbinding'; s.className = 'queue-status fout'; fout++;
      }
    }

    // Reverse-index voor clubs.html in één keer bijwerken voor de gekozen labels.
    // Bewust ná de lus en met R2 als waarheid (de Worker leest de map opnieuw uit),
    // zodat ook een gedeeltelijk geslaagde upload een kloppende index krijgt. Dit
    // vervangt de oude per-foto-index-schrijf die entries verloor. Zie handleLabelsSync.
    let labelsSyncFout = false;
    if (ok > 0 && _geselecteerdeLabels.length) {
      try {
        const syncRes = await fetch(WORKER + '/fotograaf/labels-sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
          body: JSON.stringify({ map, categorie: cat, labels: _geselecteerdeLabels }),
        });
        if (!syncRes.ok) labelsSyncFout = true;
      } catch { labelsSyncFout = true; }
    }

    btn.disabled = false; btn.textContent = '📤 Uploaden starten';

    // Houd de mislukte foto's klaar voor een nieuwe poging. Dit moet vóór toonQueue()
    // gebeuren, want die hertekent de rijen op basis van de nieuwe lijst — anders
    // wijzen de qs-indexen bij een tweede poging naar de rijen van andere foto's.
    const mislukt = bestanden.filter((_, i) => document.getElementById('qs-' + i)?.className?.includes('fout'));

    if (ok === 0) {
      // Elke foto mislukt: zonder deze tak bleef de gróéne melding van een eerdere
      // upload staan, en dacht de fotograaf dat alles geland was terwijl er niets aankwam.
      fb.textContent = `✕ Er is geen enkele foto geüpload (${fout} mislukt). Controleer je internetverbinding en klik opnieuw op "Uploaden starten" — je foto's staan nog klaar.`;
      fb.className = 'feedback err';
    } else if (fout > 0) {
      fb.textContent = `⚠ ${ok} foto${ok > 1 ? "'s" : ''} geüpload, maar ${fout} mislukt. De mislukte foto's staan nog klaar — klik opnieuw op "Uploaden starten" om alleen die te proberen.`;
      fb.className = 'feedback waarschuwing';
    } else {
      fb.innerHTML = `<span>✓ ${ok} foto${ok > 1 ? "'s" : ''} geüpload</span><br/><a href="index.html" style="display:inline-block;margin-top:0.8rem;color:var(--accent);text-decoration:underline;font-weight:700">← Terug naar de site</a>`;
      fb.className = 'feedback ok';
    }

    if (labelsSyncFout) {
      fb.insertAdjacentHTML('beforeend', '<br/><span style="color:#fbbf24">⚠ De labels konden niet worden bijgewerkt (verbinding). De foto\'s staan wél op de site; koppel de labels zo nodig later opnieuw.</span>');
    }

    bestanden = mislukt;
    toonQueue();
  };
}

let _alleLabels = [];
let _geselecteerdeLabels = [];

function renderLabelChips() {
  const container = document.getElementById('labels-chips');
  if (!container) return;
  container.innerHTML = _alleLabels.map(label => {
    const actief = _geselecteerdeLabels.includes(label);
    const stijl  = actief
      ? 'background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600'
      : '';
    return `<span class="label-chip" style="${stijl}" onclick="window.klikLabel(this,'${label.replace(/'/g,"\\'")}')">${label}</span>`;
  }).join('');
}

window.klikLabel = function(chip, label) {
  const idx = _geselecteerdeLabels.indexOf(label);
  if (idx === -1) {
    _geselecteerdeLabels.push(label);
    chip.style.background    = 'var(--accent)';
    chip.style.borderColor   = 'var(--accent)';
    chip.style.color         = '#fff';
    chip.style.fontWeight    = '600';
  } else {
    _geselecteerdeLabels.splice(idx, 1);
    chip.style.background    = '';
    chip.style.borderColor   = '';
    chip.style.color         = '';
    chip.style.fontWeight    = '';
  }
  werkLabelStatusBij();
};

// Het statusregeltje onder de chips. Wordt óók aangeroepen als de labels vanuit een
// gekozen map worden gevuld — anders bleef er "Geen labels geselecteerd" staan
// terwijl de chips wél opgelicht waren.
function werkLabelStatusBij() {
  const st = document.getElementById('labels-geselecteerd');
  if (!st) return;
  st.textContent = _geselecteerdeLabels.length
    ? '✓ Geselecteerd: ' + _geselecteerdeLabels.join(', ')
    : 'Geen labels geselecteerd';
  st.style.color = _geselecteerdeLabels.length ? 'var(--accent)' : 'var(--muted)';
}

async function laadLabels() {
  const container = document.getElementById('labels-chips');
  if (!container) return;
  container.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Laden…</span>';
  try {
    const res = await fetch('https://zaanslicht-updates.ntxzjzzg8m.workers.dev/labels');
    const data = await res.json();
    _alleLabels = data.labels || [];
    renderLabelChips();
  } catch(e) {
    container.innerHTML = '<span style="color:#ef4444;font-size:0.8rem">Fout: ' + e.message + '</span>';
  }
}

window.voegLabelToe = async function() {
  const input = document.getElementById('label-nieuw');
  const btn   = document.querySelector('[onclick="voegLabelToe()"]');
  const label = input?.value.trim();
  if (!label || label.length < 2) { input?.focus(); return; }

  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const res  = await fetch('https://zaanslicht-updates.ntxzjzzg8m.workers.dev/labels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie?.token || '' },
      body: JSON.stringify({ label }),
    });
    const data = await res.json();
    if (!data.ok) { alert('Fout: ' + (data.error || 'onbekend')); return; }
    if (!_alleLabels.includes(data.label)) _alleLabels.push(data.label);
    _alleLabels.sort((a, b) => a.localeCompare(b, 'nl'));
    if (!_geselecteerdeLabels.includes(data.label)) _geselecteerdeLabels.push(data.label);
    renderLabelChips();
    input.value = '';
  } catch(e) {
    alert('Verbindingsfout: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '+ Toevoegen'; }
  }
};

const _fotoLabelsCache = {}; // key → labels[]
let _actiefeLabelPopup = null;

async function laadFotoLabelBadge(chipEl, key) {

window.openFotoLabelPopup = async function(key, badge) {

// Label-popup met expliciet opslaan: chips aan/uit zetten wijzigt pas iets
// na een klik op 💾 Opslaan. Alleen aangeraakte labels worden toegepast,
// zodat per-foto verschillen in overige labels behouden blijven.
//
// Bij meerdere foto's kan een label op een deel van de selectie staan
// ("gemixt") — dat moet zichtbaar zijn (anders lijkt het net of er niets
// is toegekend) én in één klik voor de HELE selectie aan of uit te zetten
// (anders kun je een label dat niet overal staat nooit overal weghalen).
async function openLabelPopupVoor(doelKeys, anchor) {
  if (_actiefeLabelPopup) { _actiefeLabelPopup.remove(); _actiefeLabelPopup = null; }
  if (!_alleLabels.length) await laadLabels();

  // Zorg dat de cache compleet is vóór we de aan/uit/gemixt-status berekenen —
  // anders lijkt een label "uit" terwijl de data alleen nog niet geladen is.
  const ontbrekend = doelKeys.filter(k => _fotoLabelsCache[k] === undefined);
  if (ontbrekend.length) {
    await Promise.all(ontbrekend.map(async k => {
      try {
        const r = await fetch(WORKER + '/foto-labels?key=' + encodeURIComponent(k), { headers: { 'X-Fotograaf-Token': sessie?.token || '' } });
        _fotoLabelsCache[k] = (await r.json()).labels || [];
      } catch { _fotoLabelsCache[k] = []; }
    }));
  }

  const multi = doelKeys.length > 1;
  const titelTekst = multi ? `Labels voor ${doelKeys.length} geselecteerde foto's` : 'Labels voor deze foto';

  // Status per label: 'aan' (alle foto's hebben het), 'uit' (geen enkele), 'gemixt' (een deel)
  const statusVan = l => {
    const n = doelKeys.filter(k => (_fotoLabelsCache[k] || []).includes(l)).length;
    return n === 0 ? 'uit' : n === doelKeys.length ? 'aan' : 'gemixt';
  };

  const popup = document.createElement('div');
  popup.className = 'foto-label-popup';
  popup.innerHTML = `
    <div class="foto-label-popup-titel">${titelTekst}</div>
    <div class="foto-label-popup-chips">
      ${_alleLabels.map(l => {
        const status = statusVan(l);
        const n = doelKeys.filter(k => (_fotoLabelsCache[k] || []).includes(l)).length;
        const suffix = status === 'gemixt' ? ` <span class="foto-label-popup-count">${n}/${doelKeys.length}</span>` : '';
        return `<span class="foto-label-popup-chip ${status}" data-label="${l.replace(/"/g,'&quot;')}" data-start="${status}" data-state="${status}">${l}${suffix}</span>`;
      }).join('')}
    </div>
    ${multi ? '<div class="foto-label-popup-uitleg">Gestreept = op een deel van de selectie. Klik om overal aan of uit te zetten.</div>' : ''}
    <div class="foto-label-popup-acties">
      <button class="foto-label-popup-btn foto-label-popup-annuleer">✕ Annuleren</button>
      <button class="foto-label-popup-btn foto-label-popup-opslaan">💾 Opslaan</button>
    </div>`;

  // Positie naast het anker (label-badge of balk-knop)
  document.body.appendChild(popup);
  _actiefeLabelPopup = popup;
  const rect = anchor.getBoundingClientRect();
  let top  = rect.bottom + 6;
  let left = rect.left - 100;
  if (left < 8) left = 8;
  if (left + popup.offsetWidth > window.innerWidth - 8) left = window.innerWidth - popup.offsetWidth - 8;
  if (top + popup.offsetHeight > window.innerHeight) top = rect.top - popup.offsetHeight - 6;
  if (top < 8) top = 8;
  popup.style.top  = top  + 'px';
  popup.style.left = left + 'px';

  const titelEl = popup.querySelector('.foto-label-popup-titel');
  let bezig = false;

  // Klik cyclus: gemixt of uit → aan (voor iedereen); aan → uit (voor iedereen).
  // Zo is een label altijd in één klik voor de hele selectie te (de)selecteren.
  popup.querySelectorAll('.foto-label-popup-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if (bezig) return;
      const nieuw = chip.dataset.state === 'aan' ? 'uit' : 'aan';
      chip.dataset.state = nieuw;
      chip.classList.remove('aan', 'uit', 'gemixt');
      chip.classList.add(nieuw);
      const countEl = chip.querySelector('.foto-label-popup-count');
      if (countEl) countEl.remove();
    });
  });

  const sluit = () => { popup.remove(); _actiefeLabelPopup = null; };
  popup.querySelector('.foto-label-popup-annuleer').addEventListener('click', sluit);

  popup.querySelector('.foto-label-popup-opslaan').addEventListener('click', async () => {
    if (bezig) return;
    const chips = [...popup.querySelectorAll('.foto-label-popup-chip')];
    // Alleen labels waarvan de status daadwerkelijk is aangeklikt (state !== start) worden toegepast
    const toevoegen = chips.filter(c => c.dataset.state === 'aan' && c.dataset.state !== c.dataset.start).map(c => c.dataset.label);
    const weghalen  = chips.filter(c => c.dataset.state === 'uit' && c.dataset.state !== c.dataset.start).map(c => c.dataset.label);
    if (!toevoegen.length && !weghalen.length) { sluit(); return; }

    bezig = true;
    const opslaanBtn = popup.querySelector('.foto-label-popup-opslaan');
    opslaanBtn.disabled = true;
    let n = 0;
    let mislukt = 0;
    for (const k of doelKeys) {
      n++;
      if (multi) titelEl.textContent = `Opslaan… (${n}/${doelKeys.length})`;
      const huidige = _fotoLabelsCache[k] || [];
      const nieuwe = [...new Set([...huidige.filter(l => !weghalen.includes(l)), ...toevoegen])];
      const chipEl = document.querySelector(`.foto-chip[data-foto-key="${(window.CSS && CSS.escape) ? CSS.escape(k) : k}"]`);
      const gelukt = await slaFotoLabelsOp(k, nieuwe, chipEl);
      if (!gelukt) mislukt++;
    }
    if (mislukt) {
      // Geen alert() — blokkeert de hele pagina. Popup blijft open zodat de fotograaf kan navigeren.
      titelEl.textContent = `❌ Opslaan mislukt (${mislukt}/${doelKeys.length}) — mogelijk de dagelijkse opslaglimiet bereikt. Probeer het later opnieuw.`;
      opslaanBtn.disabled = false;
      bezig = false;
    } else {
      titelEl.textContent = '✓ Opgeslagen';
      setTimeout(sluit, 900);
    }
  });

  // Klik buiten popup sluit hem (zonder op te slaan)
  setTimeout(() => {
    document.addEventListener('click', function buiten(e) {
      if (!popup.contains(e.target) && e.target !== anchor) {
        sluit();
        document.removeEventListener('click', buiten);
      }
    });
  }, 0);
}

async function slaFotoLabelsOp(key, labels, chipEl) {
  try {
    const res = await fetch(WORKER + '/foto-labels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie?.token || '' },
      body: JSON.stringify({ key, labels }),
    });
    const data = await res.json();
    if (data.ok) {
      _fotoLabelsCache[key] = data.labels;
      if (chipEl) updateLabelBadge(chipEl, data.labels);
      return true;
    }
    return false;
  } catch { return false; }
}

window.slaKleurOp = async () => {
  const kleur = document.getElementById('inst-kleur').value;

  fb.className = 'feedback';
  try {
    const res  = await fetch(WORKER + '/fotograaf/kleur', {

    fb.textContent = '✓ Kleur opgeslagen!'; fb.className = 'feedback ok';
  } catch(e) {
    fb.textContent = 'Fout: ' + e.message; fb.className = 'feedback err';
  }
};

async function vulMappenSelect() {
  const select = document.getElementById('up-map-select');
  if (!select || !sessie) return;

  // Laad mappen als ze nog niet geladen zijn
  if (_mappenData.length === 0) {
    try {
      const res = await fetch(WORKER + '/fotograaf/manifest');
      const data = await res.json();
      const fg = (data.fotografen || []).find(f => f.id === sessie.id);
      _mappenData = fg?.mappen || [];
    } catch (e) {
      return;
    }
  }

  // Onthoud de huidige keuze: deze functie draait bij élke tabwissel naar Upload
  // en bouwt de lijst opnieuw op. Zonder herstel valt de keuze uit de dropdown
  // terwijl #up-map de naam vasthoudt — dan toont de dropdown "Nieuwe map" maar
  // gaat de upload alsnog naar de oude map (of andersom bij een lege #up-map:
  // een terechte maar onbegrijpelijke "Vul een mapnaam in").
  const gekozen = select.value || document.getElementById('up-map')?.value.trim() || '';

  // Vul select met bestaande mappen
  select.innerHTML = '<option value="">— Nieuwe map —</option>';
  _mappenData.forEach(m => {
    const optie = document.createElement('option');
    optie.value = m.map;
    optie.textContent = m.map;
    select.appendChild(optie);
  });

  if (gekozen && _mappenData.some(m => m.map === gekozen)) select.value = gekozen;
}

// Synchroniseer select met text input.
// Let op: #up-map-select bestaat nog niet bij page-load (wordt pas ingevoegd
// door toonDashboard() na inloggen) — een addEventListener op het element zelf
// zou hier stil falen. Event delegation op document werkt ongeacht wanneer
// het element verschijnt of opnieuw wordt getekend.
document.addEventListener('change', function(e) {
  if (e.target.id !== 'up-map-select') return;
  const select = e.target;
  const mapInput = document.getElementById('up-map');
  if (mapInput) mapInput.value = select.value;

  // Laad bestaande labels van deze map
  if (select.value && _mappenData.length) {
    const map = _mappenData.find(m => m.map === select.value);
    _geselecteerdeLabels = map?.labels?.length ? [...map.labels] : [];
    renderLabelChips();
    werkLabelStatusBij();
  }
});
