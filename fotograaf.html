<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotograaf Portal — Zaans Licht</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:  #FF6B00;
    --black:   #080808;
    --s1:      #111;
    --s2:      #181818;
    --border:  rgba(255,255,255,0.08);
    --text:    #F0F0F0;
    --muted:   #666;
    --font:    'Segoe UI', system-ui, sans-serif;
    --mono:    'Courier New', monospace;
    --radius:  12px;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: pageFadeIn 0.22s ease;
  }
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font); cursor: pointer; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 3rem;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,8,0.9);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 3.2rem; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .logo img { width: 80px; height: 80px; object-fit: contain; }
  .logo span { color: var(--accent); }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .card {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 520px;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.6rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .card-label::before {
    content: ''; display: block;
    width: 16px; height: 1px;
    background: var(--accent);
  }

  .card h2 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.4rem;
  }

  .card-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  /* ── TOOLTIP HELP ── */
  .help-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .help-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted); font-size: 0.65rem; font-weight: 700;
    cursor: default; flex-shrink: 0; margin-left: 0.4rem;
    line-height: 1;
    transition: background 0.15s;
  }
  .help-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .help-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    background: #1e1e1e;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-size: 0.75rem; font-weight: 400; text-transform: none;
    line-height: 1.5; letter-spacing: 0;
    color: #ccc;
    width: 220px; max-width: 90vw;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 100;
    pointer-events: none;
    white-space: normal;
  }
  .help-tip::after {
    content: '';
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #1e1e1e;
  }
  .help-wrap:hover .help-tip { display: block; }

  /* Label rij met help knop */
  .label-row {
    display: flex; align-items: center; gap: 0;
  }

  /* ── HANDLEIDING ── */
  .handleiding {
    background: rgba(255,107,0,0.06);
    border: 1px solid rgba(255,107,0,0.2);
    border-radius: 10px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .handleiding-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.2rem; cursor: pointer;
    font-size: 0.85rem; font-weight: 600; color: var(--accent);
  }
  .handleiding-header:hover { background: rgba(255,107,0,0.04); }
  .handleiding-header span { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
  .handleiding-body {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid rgba(255,107,0,0.15);
  }
  .handleiding-body.open { display: block; }
  .handleiding-stap {
    display: flex; gap: 0.8rem; align-items: flex-start;
    padding: 0.7rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.82rem; color: #bbb; line-height: 1.5;
  }
  .handleiding-stap:last-child { border-bottom: none; }
  .handleiding-nr {
    background: var(--accent); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
    margin-top: 0.1rem;
  }

  /* ── FORM ── */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }

  label {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(240,240,240,0.7);
    text-transform: uppercase;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="color"] {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 0.75rem 1rem;
    font-family: var(--font);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 0.85rem;
    border-radius: var(--radius);
    border: none;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #ff8c33; transform: translateY(-1px); }
  .btn-primary:disabled { background: #333; color: var(--muted); transform: none; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .feedback {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-radius: var(--radius);
    font-size: 0.85rem;
    display: none;
  }
  .feedback.ok  { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; display: block; }
  .feedback.err { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; display: block; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(255,107,0,0.04);
  }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .upload-zone .uz-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .upload-zone .uz-titel {
    font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem;
  }
  .upload-zone .uz-sub { font-size: 0.8rem; color: var(--muted); }

  /* ── UPLOAD QUEUE ── */
  .upload-queue {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 280px;
    overflow-y: auto;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.82rem;
  }
  .queue-item img {
    width: 44px; height: 44px;
    object-fit: cover; border-radius: 6px;
    flex-shrink: 0;
  }
  .queue-naam { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-size { color: var(--muted); flex-shrink: 0; font-family: var(--mono); font-size: 0.72rem; }
  .queue-status { flex-shrink: 0; font-size: 0.75rem; }
  .queue-status.wacht { color: var(--muted); }
  .queue-status.bezig { color: #fbbf24; }
  .queue-status.ok    { color: #4ade80; }
  .queue-status.fout  { color: #f87171; }

  /* ── KLEUR PICKER ── */
  .kleur-row {
    display: flex; align-items: center; gap: 0.8rem;
    margin-bottom: 1rem;
  }
  .kleur-row input[type="color"] {
    width: 48px; height: 48px;
    padding: 0.2rem;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .kleur-label { font-size: 0.82rem; color: var(--muted); }

  /* ── DASHBOARD (na inlog) ── */
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
    flex-wrap: wrap; gap: 0.8rem;
  }
  .dash-naam {
    font-size: 1.4rem; font-weight: 700;
  }
  .dash-badge {
    font-size: 0.72rem; font-family: var(--mono);
    letter-spacing: 1px; text-transform: uppercase;
    padding: 0.25rem 0.7rem; border-radius: 100px;
    border: 1px solid var(--border); color: var(--muted);
  }

  .tabs {
    display: flex; gap: 0.3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    background: none; border: none;
    color: var(--muted); font-size: 0.82rem;
    font-weight: 600; letter-spacing: 0.5px;
    padding: 0.6rem 1rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── VOLGORDE LIJST ── */
  .map-item {
    background: var(--s2); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; margin-bottom: 0.6rem;
    overflow: hidden; transition: border-color 0.15s;
  }
  .map-item:hover { border-color: rgba(255,255,255,0.15); }
  .map-item.leeg { border-color: rgba(239,68,68,0.3); }
  .map-item.sortable-ghost { opacity: 0.4; }
  .map-item.sortable-chosen { box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .map-header {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.7rem 1rem; cursor: default;
  }
  .map-thumb {
    width: 52px; height: 36px; border-radius: 4px;
    object-fit: cover; flex-shrink: 0; background: #111;
  }
  .map-thumb-leeg {
    width: 52px; height: 36px; border-radius: 4px; flex-shrink: 0;
    background: #1a1a1a; border: 1px dashed #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .map-drag-handle {
    color: var(--muted); font-size: 1.1rem; cursor: grab;
    padding: 0 0.2rem; user-select: none; flex-shrink: 0;
  }
  .map-drag-handle:active { cursor: grabbing; }
  .map-info { flex: 1; min-width: 0; }
  .map-naam { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
  .map-cat-badge {
    font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
    padding: 0.2rem 0.55rem; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.1); color: var(--muted); flex-shrink: 0;
  }
  .map-expand-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.85rem; padding: 0.2rem 0.4rem; transition: color 0.15s, transform 0.2s;
    flex-shrink: 0;
  }
  .map-expand-btn.open { transform: rotate(180deg); color: var(--accent); }
  .map-fotos-paneel {
    display: none; border-top: 1px solid rgba(255,255,255,0.06);
    padding: 0.8rem 1rem; background: #0f0f0f;
  }
  .map-fotos-grid {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.8rem;
  }
  .foto-chip {
    position: relative; width: 72px; height: 52px; border-radius: 4px;
    overflow: hidden; cursor: pointer; flex-shrink: 0;
    border: 2px solid transparent; transition: border-color 0.15s;
  }
  .foto-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-chip:hover .foto-chip-del { opacity: 1; }
  .foto-chip-del {
    position: absolute; inset: 0; background: rgba(239,68,68,0.85);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; opacity: 0; transition: opacity 0.15s;
  }
  .map-verwijder-btn {
    background: none; border: 1px solid rgba(239,68,68,0.4); color: #ef4444;
    border-radius: 6px; padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer;
    transition: all 0.15s;
  }
  .map-verwijder-btn:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }

  /* GROEPEN */
  .map-groep { margin-bottom: 1.5rem; }
  .map-groep-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); padding: 0 0.2rem 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 0.6rem;
  }
  .map-groep-teller { font-weight: 400; }
  .map-groep-lijst { min-height: 2rem; }
  .map-cat-select {
    background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12); color: var(--text);
    border-radius: 6px; padding: 0.25rem 0.5rem; font-size: 0.75rem; cursor: pointer;
    flex-shrink: 0; transition: border-color 0.15s; font-family: var(--font);
  }
  .map-cat-select:focus { outline: none; border-color: var(--accent); }

  /* LABELS */
  .label-chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.25rem 0.65rem; border-radius: 100px; font-size: 0.78rem;
    border: 1px solid rgba(255,255,255,0.15); color: var(--muted);
    background: var(--s2); cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .label-chip:hover { border-color: var(--accent); color: var(--accent); }
  .label-chip.actief { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* POSITIE TAB */
  .positie-groep { margin-bottom: 1.5rem; }
  .positie-groep-header {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); padding: 0 0.2rem 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 0.6rem;
  }
  .positie-item {
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--s2); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 0.4rem;
  }
  .positie-item.eigen { border-left: 3px solid var(--accent); cursor: default; }
  .positie-item.ander { opacity: 0.45; cursor: not-allowed; }
  .positie-item .drag-handle { color: var(--muted); font-size: 1.1rem; cursor: grab; user-select: none; flex-shrink: 0; }
  .positie-item.ander .drag-handle { display: none; }
  .positie-naam { flex: 1; font-size: 0.88rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .positie-meta { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }

  /* ── MAPPEN OVERZICHT ── */
  .mappen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .map-card {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .map-card:hover { border-color: var(--accent); }
  .map-card .mc-icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
  .map-card .mc-naam { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-card .mc-cat  { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; }

  /* ── UITLOGGEN ── */
  .logout-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 0.35rem 0.9rem;
    border-radius: 8px; font-size: 0.78rem; transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

  @media (max-width: 600px) {
    header { padding: 1rem 1.2rem; }
    .card  { padding: 1.5rem; }
  }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="images/logo-oranje.png" alt="Zaans Licht" />
    Zaans<span> Licht</span>
  </div>
  <a href="index.html" style="font-size:0.8rem;color:var(--muted)">← Terug naar site</a>
</header>

<main id="main-content">
  <!-- Wordt ingevuld door JavaScript -->
  <div class="card">
    <p style="color:var(--muted);text-align:center;font-family:var(--mono);font-size:0.85rem">Laden…</p>
  </div>
</main>

<script>
const WORKER = 'https://zaanslicht-updates.ntxzjzzg8m.workers.dev';
const params = new URLSearchParams(window.location.search);
const inviteToken = params.get('invite');

// ── Laad opgeslagen sessie ────────────────────────────────────────────────
let sessie = JSON.parse(localStorage.getItem('zl_fotograaf') || 'null');

window.addEventListener('DOMContentLoaded', () => {
  if (sessie?.token) {
    toonDashboard();
    checkPositieBeheer();
  } else if (inviteToken) {
    toonRegistreren();
  } else {
    toonInloggen();
  }
});

// ══════════════════════════════════════════════════════
// INLOGGEN
// ══════════════════════════════════════════════════════
function toonInloggen() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <p class="card-label">Fotograaf Portal</p>
      <h2>Inloggen</h2>
      <p class="card-sub">Log in met je e-mailadres en wachtwoord om foto's te uploaden.</p>
      <form id="login-form">
        <div class="form-group">
          <label>E-mailadres</label>
          <input type="email" id="login-email" placeholder="jouw@email.nl" required />
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" id="login-pw" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Inloggen →</button>
      </form>
      <div id="login-feedback" class="feedback"></div>
    </div>`;

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Bezig…';
    const fb = document.getElementById('login-feedback');
    fb.className = 'feedback';

    try {
      const res  = await fetch(WORKER + '/fotograaf/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-pw').value,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Inloggen mislukt');
      sessie = { token: data.token, naam: data.naam, kleur: data.kleur, id: data.id };
      localStorage.setItem('zl_fotograaf', JSON.stringify(sessie));
      toonDashboard();
    } catch(err) {
      fb.textContent = err.message; fb.className = 'feedback err';
      btn.disabled = false; btn.textContent = 'Inloggen →';
    }
  });
}

// ══════════════════════════════════════════════════════
// REGISTREREN (via invite link)
// ══════════════════════════════════════════════════════
function toonRegistreren() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">

          </div>
          <input type="password" id="reg-pw" placeholder="Minimaal 8 tekens" minlength="8" required />
        </div>
        <div class="form-group">

        <div class="form-group">

            <div class="help-wrap">
              <span class="help-btn">?</span>
              <div class="help-tip">Deze kleur wordt als accent gebruikt bij jouw foto's op de site. Je kunt hem later altijd aanpassen via Instellingen.</div>
            </div>

      </form>
      <div id="reg-feedback" class="feedback"></div>
    </div>`;

  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const fb  = document.getElementById('reg-feedback');
    const pw  = document.getElementById('reg-pw').value;
    const pw2 = document.getElementById('reg-pw2').value;

    if (pw !== pw2) { fb.textContent = 'Wachtwoorden komen niet overeen.'; fb.className = 'feedback err'; return; }

    btn.disabled = true; btn.textContent = 'Bezig…';
    fb.className = 'feedback';

    try {
      const res  = await fetch(WORKER + '/fotograaf/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inviteToken, password: pw,
          kleur: document.getElementById('reg-kleur').value,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Registratie mislukt');
      sessie = { token: data.token, naam: data.naam, kleur: data.kleur, id: data.id };
      localStorage.setItem('zl_fotograaf', JSON.stringify(sessie));
      history.replaceState(null, '', '/fotograaf.html');
      toonDashboard(true);
    } catch(err) {
      fb.textContent = err.message; fb.className = 'feedback err';
      btn.disabled = false; btn.textContent = 'Account aanmaken →';
    }
  });
}

  // DOM is nu klaar — laad labels direct
  laadLabels();

  // Stijl accentkleur dynamisch
  document.documentElement.style.setProperty('--accent', sessie.kleur || '#FF6B00');

  // Upload zone drag & drop
  const zone  = document.getElementById('upload-zone');
  const input = document.getElementById('file-input');
  let bestanden = [];

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    verwerkBestanden([...e.dataTransfer.files]);
  });
  input.addEventListener('change', () => verwerkBestanden([...input.files]));

  function verwerkBestanden(files) {
    const toegestaan = files.filter(f => {
      const n = f.name.toLowerCase();
      return (n.endsWith('.webp') || n.endsWith('.jpg') || n.endsWith('.jpeg')) && f.size <= 15*1024*1024;
    });
    bestanden = [...bestanden, ...toegestaan];
    toonQueue();
  }

  function isJpg(f) { const n = f.name.toLowerCase(); return n.endsWith('.jpg') || n.endsWith('.jpeg'); }

  function toonQueue() {
    const queue   = document.getElementById('upload-queue');
    const btn     = document.getElementById('upload-btn');
    const convert = document.getElementById('auto-convert')?.checked;
    queue.innerHTML = bestanden.map((f, i) => {
      const jpg = isJpg(f);
      const tag = jpg && convert ? '<span style="font-size:0.65rem;background:rgba(255,107,0,0.2);color:var(--accent);border-radius:4px;padding:0.1rem 0.4rem;flex-shrink:0">→ WebP</span>' : '';
      return `<div class="queue-item" id="qi-${i}">
        <div style="font-size:1.2rem">${jpg ? '🖼️' : '🌐'}</div>
        <span class="queue-naam">${f.name}</span>
        ${tag}
        <span class="queue-size">${(f.size/1024/1024).toFixed(1)} MB</span>
        <span class="queue-status wacht" id="qs-${i}">Wacht</span>
      </div>`;
    }).join('');
    btn.style.display = bestanden.length ? '' : 'none';
  }

  // Herrender queue als convert-checkbox verandert
  document.getElementById('auto-convert')?.addEventListener('change', toonQueue);

  // Converteer JPG naar WebP via Canvas
  async function converteerNaarWebp(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          if (!blob) { reject(new Error('Conversie mislukt')); return; }
          const webpNaam = file.name.replace(/\.(jpg|jpeg)$/i, '.webp');
          resolve(new File([blob], webpNaam, { type: 'image/webp' }));
        }, 'image/webp', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Afbeelding kon niet worden geladen')); };
      img.src = url;
    });
  }

  container.innerHTML = _alleLabels.map(label => {
    const actief = _geselecteerdeLabels.includes(label);
    const stijl  = actief
      ? 'background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600'
      : '';
    return `<span class="label-chip" style="${stijl}" onclick="window.klikLabel(this,'${label.replace(/'/g,"\\'")}')">${label}</span>`;
  }).join('');
}

window.klikLabel = function(chip, label) {
  const idx = _geselecteerdeLabels.indexOf(label);
  if (idx === -1) {
    _geselecteerdeLabels.push(label);
    chip.style.background    = 'var(--accent)';
    chip.style.borderColor   = 'var(--accent)';
    chip.style.color         = '#fff';
    chip.style.fontWeight    = '600';
  } else {
    _geselecteerdeLabels.splice(idx, 1);
    chip.style.background    = '';
    chip.style.borderColor   = '';
    chip.style.color         = '';
    chip.style.fontWeight    = '';
  }
  const st = document.getElementById('labels-geselecteerd');
  if (st) {
    st.textContent = _geselecteerdeLabels.length
      ? '✓ Geselecteerd: ' + _geselecteerdeLabels.join(', ')
      : 'Geen labels geselecteerd';
    st.style.color = _geselecteerdeLabels.length ? 'var(--accent)' : 'var(--muted)';
  }
};

async function laadLabels() {
  const container = document.getElementById('labels-chips');
  if (!container) return;
  container.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Laden…</span>';
  try {
    const res = await fetch('https://zaanslicht-updates.ntxzjzzg8m.workers.dev/labels');
    const data = await res.json();
    _alleLabels = data.labels || [];
    renderLabelChips();
  } catch(e) {
    container.innerHTML = '<span style="color:#ef4444;font-size:0.8rem">Fout: ' + e.message + '</span>';
  }
}

window.voegLabelToe = async function() {
  const input = document.getElementById('label-nieuw');
  const btn   = document.querySelector('[onclick="voegLabelToe()"]');
  const label = input?.value.trim();
  if (!label || label.length < 2) { input?.focus(); return; }

  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const res  = await fetch('https://zaanslicht-updates.ntxzjzzg8m.workers.dev/labels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie?.token || '' },
      body: JSON.stringify({ label }),
    });
    const data = await res.json();
    if (!data.ok) { alert('Fout: ' + (data.error || 'onbekend')); return; }
    if (!_alleLabels.includes(data.label)) _alleLabels.push(data.label);
    _alleLabels.sort((a, b) => a.localeCompare(b, 'nl'));
    if (!_geselecteerdeLabels.includes(data.label)) _geselecteerdeLabels.push(data.label);
    renderLabelChips();
    input.value = '';
  } catch(e) {
    alert('Verbindingsfout: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '+ Toevoegen'; }
  }
};

window.startUpload = async () => {
    const btn  = document.getElementById('upload-btn');
    const map  = document.getElementById('up-map').value.trim();
    const cat  = document.getElementById('up-categorie').value;
    const fb   = document.getElementById('upload-feedback');

    if (!map) { fb.textContent = 'Vul een mapnaam in.'; fb.className = 'feedback err'; return; }
    if (!bestanden.length) return;

    btn.disabled = true; btn.textContent = 'Bezig met uploaden…';
    fb.className = 'feedback';

    const doConvert = document.getElementById('auto-convert')?.checked;
    let ok = 0, fout = 0;
    for (let i = 0; i < bestanden.length; i++) {
      const s = document.getElementById('qs-' + i);
      s.textContent = '⟳ Bezig'; s.className = 'queue-status bezig';

      let uploadBestand = bestanden[i];
      if (doConvert && isJpg(uploadBestand)) {
        try {
          s.textContent = '⟳ Omzetten…'; s.className = 'queue-status bezig';
          uploadBestand = await converteerNaarWebp(uploadBestand);
        } catch(convErr) {
          s.textContent = '✕ Conversie mislukt'; s.className = 'queue-status fout'; fout++; continue;
        }
      }

      const form = new FormData();
      form.append('foto', uploadBestand);
      form.append('map', map);
      form.append('categorie', cat);
      form.append('labels', JSON.stringify(_geselecteerdeLabels));

      try {
        const res  = await fetch(WORKER + '/fotograaf/upload', {
          method: 'POST',
          headers: { 'X-Fotograaf-Token': sessie.token },
          body: form,
        });
        const data = await res.json();
        if (data.ok) { s.textContent = '✓'; s.className = 'queue-status ok'; ok++; }
        else { s.textContent = '✕ ' + (data.error || 'fout'); s.className = 'queue-status fout'; fout++; }
      } catch {
        s.textContent = '✕ verbinding'; s.className = 'queue-status fout'; fout++;
      }
    }

    btn.disabled = false; btn.textContent = '📤 Uploaden starten';
    if (ok > 0) {
      const msg = `✓ ${ok} foto${ok > 1 ? "'s" : ''} geüpload${fout ? `, ${fout} mislukt` : ''}`;
      fb.innerHTML = `<span>${msg}</span><br/><a href="index.html" style="display:inline-block;margin-top:0.8rem;color:var(--accent);text-decoration:underline;font-weight:700">← Terug naar de site</a>`;
      fb.className = 'feedback ok';
      bestanden = bestanden.filter((_, i) => document.getElementById('qs-' + i)?.className?.includes('fout'));
    }
  };
}

async function laadProfiel() {
  if (!sessie) return;
  try {
    const res  = await fetch(WORKER + '/fotograaf/profielen');
    const data = await res.json();
    const mijn = (data.profielen || []).find(p => p.id === sessie.id);
    if (mijn?.bio) {
      document.getElementById('profiel-bio').value = mijn.bio;
      document.getElementById('bio-teller').textContent = mijn.bio.length;
    }
    const preview     = document.getElementById('profiel-foto-preview');
    const placeholder = document.getElementById('profiel-foto-placeholder');
    if (mijn?.fotoUrl) {
      document.getElementById('profiel-foto-img').src = WORKER + mijn.fotoUrl;
      preview.style.display     = 'block';
      placeholder.style.display = 'none';
    } else {
      preview.style.display     = 'none';
      placeholder.style.display = 'flex';
    }
  } catch {}
}

// Teken-teller
document.getElementById('profiel-bio')?.addEventListener('input', function() {
  document.getElementById('bio-teller').textContent = this.value.length;
});

// Foto-preview bij kiezen
document.getElementById('profiel-foto-input')?.addEventListener('change', function() {
  const file = this.files[0];

  document.getElementById('profiel-foto-naam').textContent = file.name;

  reader.onload = e => {

    document.getElementById('profiel-foto-preview').style.display = 'block';
    document.getElementById('profiel-foto-placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ bio }),

async function vulMappenSelect() {
  const select = document.getElementById('up-map-select');
  if (!select || !sessie) return;

  // Laad mappen als ze nog niet geladen zijn
  if (_mappenData.length === 0) {
    try {
      const res = await fetch(WORKER + '/fotograaf/manifest');
      const data = await res.json();
      const fg = (data.fotografen || []).find(f => f.id === sessie.id);
      _mappenData = fg?.mappen || [];

    optie.value = m.map;
    optie.textContent = m.map;
    select.appendChild(optie);
  });

document.getElementById('up-map-select')?.addEventListener('change', function() {

  if (mapInput) mapInput.value = this.value;

  // Laad bestaande labels van deze map
  if (this.value && _mappenData.length) {
    const map = _mappenData.find(m => m.map === this.value);
    if (map?.labels?.length) {
      _geselecteerdeLabels = [...map.labels];
      renderLabelChips();

});

let _mappenData = []; // huidige volgorde

async function laadMappenTab() {
  if (!sessie) return;
  const inhoud = document.getElementById('mappen-inhoud');
  const acties = document.getElementById('mappen-acties');
  inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Laden…</p>';
  acties.style.display = 'none';

  try {
    const [manifestRes, fotosRes] = await Promise.all([
      fetch(WORKER + '/fotograaf/manifest'),
      fetch(WORKER + '/fotograaf/fotos?id=' + sessie.id, { headers: { 'X-Fotograaf-Token': sessie.token } }),
    ]);
    const manifestData = await manifestRes.json();
    const fotosData    = await fotosRes.json();

    const fg = (manifestData.fotografen || []).find(f => f.id === sessie.id);
    _mappenData = fg?.mappen || [];

    const handleiding = document.getElementById('handleiding-intro');
    if (handleiding) handleiding.style.display = _mappenData.length > 0 ? 'none' : 'block';

    if (!_mappenData.length) {
      inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Je hebt nog geen mappen aangemaakt. Upload foto\'s om een map te starten.</p>';
      return;
    }

    // Groepeer fotos per mapnaam
    const alleFotos = fotosData.fotos || [];
    const fotoPerMap = {};
    for (const f of alleFotos) {
      if (f.key.includes('/profiel.')) continue;
      const delen = decodeURIComponent(f.key).split('/');
      if (delen.length < 5) continue;
      const mapNaam = delen[3];
      if (!fotoPerMap[mapNaam]) fotoPerMap[mapNaam] = [];
      fotoPerMap[mapNaam].push(f);
    }

    // Bouw een map-item element
    function maakMapItem(m, fotos) {
      const isLeeg   = fotos.length === 0;
      const thumbSrc = fotos.length > 0 ? `${WORKER}/foto/${fotos[0].key}` : null;
      const li = document.createElement('div');
      li.className = 'map-item' + (isLeeg ? ' leeg' : '');
      li.dataset.map = m.map;
      li.dataset.categorie = m.categorie;
      li.dataset.ts = m.ts || 0;

      li.innerHTML = `
        <div class="map-header">
          <span class="map-drag-handle" title="Sleep om te sorteren">⠿</span>
          ${thumbSrc
            ? `<img class="map-thumb" src="${thumbSrc}" alt="" />`
            : `<div class="map-thumb-leeg">📁</div>`}
          <div class="map-info">
            <div class="map-naam" title="${m.map}">${m.map}</div>
            <div class="map-meta">${isLeeg
              ? '<span style="color:#ef4444">⚠ Geen foto\'s — niet zichtbaar op de site</span>'
              : `${fotos.length} foto${fotos.length !== 1 ? '\'s' : ''}`}
            </div>
          </div>
          <select class="map-cat-select" onchange="wisselCategorie(this)">
            <option value="voetbal"  ${m.categorie === 'voetbal'  ? 'selected' : ''}>⚽ Voetbal</option>
            <option value="nosports" ${m.categorie === 'nosports' ? 'selected' : ''}>🌿 No Sports</option>
            <option value="eigen"    ${m.categorie === 'eigen'    ? 'selected' : ''}>📷 Eigen pagina</option>
          </select>
          <button class="map-expand-btn" title="Foto's bekijken" onclick="toggleMapFotos(this)">▾</button>
        </div>
        <div class="map-fotos-paneel">
          <div class="map-fotos-grid"></div>
          <button class="map-verwijder-btn" onclick="verwijderMap('${m.map.replace(/'/g,"\\'")}', ${fotos.length})">
            🗑 ${isLeeg ? 'Lege map verwijderen' : 'Hele map verwijderen'}
          </button>
        </div>`;

      const grid = li.querySelector('.map-fotos-grid');
      for (const f of fotos) {
        const naam = decodeURIComponent(f.key.split('/').pop());
        const chip = document.createElement('div');
        chip.className = 'foto-chip';
        chip.title = naam;
        chip.innerHTML = `
          <img src="${WORKER}/foto/${f.key}" loading="lazy" alt="${naam}" />
          <div class="foto-chip-del" onclick="verwijderFoto('${f.key.replace(/'/g,"\\'")}', this)" title="Verwijder ${naam}">🗑</div>`;
        grid.appendChild(chip);
      }
      return li;
    }

    // Drie groepen
    const groepen = [
      { id: 'voetbal',  label: '⚽ Voetbal',      categorie: 'voetbal'  },
      { id: 'nosports', label: '🌿 No Sports',     categorie: 'nosports' },
      { id: 'eigen',    label: '📷 Eigen pagina',  categorie: 'eigen'    },
    ];

    const wrapper = document.createElement('div');
    wrapper.id = 'mappen-sorteer-lijst';

    for (const groep of groepen) {
      const mappen = _mappenData.filter(m => m.categorie === groep.categorie);

      const sectie = document.createElement('div');
      sectie.className = 'map-groep';
      sectie.dataset.categorie = groep.categorie;
      sectie.innerHTML = `
        <div class="map-groep-header">
          <span>${groep.label}</span>
          <span class="map-groep-teller">${mappen.length} map${mappen.length !== 1 ? 'pen' : ''}</span>
        </div>
        <div class="map-groep-lijst" data-categorie="${groep.categorie}"></div>`;

      const lijst = sectie.querySelector('.map-groep-lijst');
      for (const m of mappen) {
        lijst.appendChild(maakMapItem(m, fotoPerMap[m.map] || []));
      }

      if (mappen.length === 0) {
        lijst.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0;font-style:italic">Geen mappen in deze categorie</p>';
      }

      new Sortable(lijst, {
        animation: 200,
        handle: '.map-drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() { document.getElementById('volgorde-feedback').textContent = ''; }
      });

      wrapper.appendChild(sectie);
    }

    inhoud.innerHTML = '';
    inhoud.appendChild(wrapper);
    acties.style.display = 'flex';

  } catch (e) {
    inhoud.innerHTML = '<p style="color:#ef4444;font-size:0.85rem">Kon mappen niet laden: ' + e.message + '</p>';
  }
}

function toggleMapFotos(btn) {
  const paneel = btn.closest('.map-item').querySelector('.map-fotos-paneel');
  const open   = paneel.style.display === 'block';
  paneel.style.display = open ? 'none' : 'block';
  btn.classList.toggle('open', !open);
}

function wisselCategorie(select) {
  const mapItem   = select.closest('.map-item');
  const oudeLijst = mapItem.closest('.map-groep-lijst');
  const nieuweCategorie = select.value;

  // Update data-categorie op het map-item
  mapItem.dataset.categorie = nieuweCategorie;

  // Verplaats naar de juiste groep-lijst
  const nieuweLijst = document.querySelector(`.map-groep-lijst[data-categorie="${nieuweCategorie}"]`);
  if (nieuweLijst && nieuweLijst !== oudeLijst) {
    // Verwijder lege-tekst placeholder als die er nog is
    const leegTekst = nieuweLijst.querySelector('p');
    if (leegTekst) leegTekst.remove();
    nieuweLijst.appendChild(mapItem);

    // Controleer of oude lijst nu leeg is
    if (!oudeLijst.querySelector('.map-item')) {
      oudeLijst.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0;font-style:italic">Geen mappen in deze categorie</p>';
    }
    // Update teller
    actualiseerTellers();
  }
  document.getElementById('volgorde-feedback').textContent = '';
}

async function verwijderFoto(key, delBtn) {
  const chip = delBtn.closest('.foto-chip');
  if (!confirm('Deze foto van de site verwijderen?')) return;
  delBtn.innerHTML = '…';
  try {
    const res  = await fetch(WORKER + '/fotograaf/foto-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ key }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Fout');
    chip.remove();
    // Update teller
    const mapItem = document.querySelector(`[data-map="${decodeURIComponent(key).split('/')[3]}"]`);
    if (mapItem) {
      const grid  = mapItem.querySelector('.map-fotos-grid');
      const count = grid.querySelectorAll('.foto-chip').length;
      const meta  = mapItem.querySelector('.map-meta');
      if (count === 0) {
        meta.innerHTML = '<span style="color:#ef4444">⚠ Geen foto\'s — niet zichtbaar op de site</span>';
        mapItem.classList.add('leeg');
        mapItem.querySelector('.map-verwijder-btn').textContent = '🗑 Lege map verwijderen';
      } else {
        meta.textContent = `${count} foto${count !== 1 ? "'s" : ""}`;
      }
    }
  } catch (e) {
    alert('Verwijderen mislukt: ' + e.message);
    delBtn.innerHTML = '🗑';
  }
}

async function verwijderMap(mapNaam, aantalFotos) {
  const vraag = aantalFotos > 0
    ? `Weet je zeker dat je "${mapNaam}" wilt verwijderen?\n\nAlle ${aantalFotos} foto's worden permanent van de site verwijderd.`
    : `Lege map "${mapNaam}" verwijderen?`;
  if (!confirm(vraag)) return;

  try {
    // Haal alle foto-keys van deze map op en verwijder ze één voor één
    const res   = await fetch(WORKER + '/fotograaf/fotos?id=' + sessie.id, { headers: { 'X-Fotograaf-Token': sessie.token } });
    const data  = await res.json();
    const fotos = (data.fotos || []).filter(f => {
      try { return decodeURIComponent(f.key).split('/')[3] === mapNaam; } catch { return false; }
    });

    for (const f of fotos) {
      await fetch(WORKER + '/fotograaf/foto-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
        body: JSON.stringify({ key: f.key }),
      });
    }

    // Verwijder map uit de mappen-lijst in KV
    const nieuweMappen = _mappenData.filter(m => m.map !== mapNaam);
    await fetch(WORKER + '/fotograaf/mappen-volgorde', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ mappen: nieuweMappen }),
    });

    // Herlaad de tab
    await laadMappenTab();
  } catch (e) {
    alert('Verwijderen mislukt: ' + e.message);
  }
}

function actualiseerTellers() {
  document.querySelectorAll('.map-groep').forEach(groep => {
    const aantal = groep.querySelectorAll('.map-item').length;
    const teller = groep.querySelector('.map-groep-teller');
    if (teller) teller.textContent = `${aantal} map${aantal !== 1 ? 'pen' : ''}`;
  });
}

window.slaMappenVolgordeOp = async () => {
  const btn = document.getElementById('btn-volgorde-opslaan');
  const fb  = document.getElementById('volgorde-feedback');
  btn.disabled = true; btn.textContent = 'Opslaan…';

  // Lees per groep de volgorde uit — categorie staat op de groep-lijst
  const nieuweMappen = [];
  document.querySelectorAll('.map-groep-lijst').forEach(lijst => {
    const categorie = lijst.dataset.categorie;
    lijst.querySelectorAll('.map-item').forEach(el => {
      nieuweMappen.push({
        map:       el.dataset.map,
        categorie: categorie,
        ts:        Number(el.dataset.ts),
      });
    });
  });

  try {
    const res  = await fetch(WORKER + '/fotograaf/mappen-volgorde', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ mappen: nieuweMappen }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Fout');
    fb.textContent = '✓ Volgorde opgeslagen';
    fb.style.color = '#22c55e';
    _mappenData = nieuweMappen;
  } catch (e) {
    fb.textContent = '✕ ' + e.message;
    fb.style.color = '#ef4444';
  }
  btn.disabled = false; btn.textContent = 'Volgorde opslaan';
};

async function laadPositieTab() {
  if (!sessie) return;
  const inhoud = document.getElementById('positie-inhoud');
  const acties = document.getElementById('positie-acties');
  inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Laden…</p>';
  acties.style.display = 'none';

  try {
    const [volRes, manifestRes] = await Promise.all([
      fetch(WORKER + '/gallery/volgorde'),
      fetch(WORKER + '/fotograaf/manifest'),
    ]);
    const volData      = await volRes.json();
    const manifestData = await manifestRes.json();

    // Bouw een naam-lookup voor alle fotografen
    const fgById = {};
    for (const fg of (manifestData.fotografen || [])) {
      fgById[fg.id] = fg;
    }

    const wrapper = document.createElement('div');

    // Laad ook manifest.json voor eigen (Andreas) series
    let eigenManifest = {};
    try {
      const mr = await fetch('manifest.json?v=' + Date.now());
      eigenManifest = await mr.json();
    } catch {}

    for (const cat of ['voetbal', 'nosports']) {
      const catLabel = cat === 'voetbal' ? '⚽ Voetbal' : '🌿 No Sports';

      // Als er geen opgeslagen volgorde is, bouw een standaard op uit manifest + gast-mappen
      let volgorde = volData[cat];
      if (!volgorde?.length) {
        volgorde = [
          ...(eigenManifest[cat] || []).map(item => ({ type: 'eigen', map: item.map })),
          ...(Object.values(fgById)).flatMap(fg =>
            (fg.mappen || [])
              .filter(m => m.categorie === cat || (cat === 'voetbal' && m.categorie === 'eigen'))
              .map(m => ({ type: 'gast', fgId: fg.id, fgCat: m.categorie, map: m.map }))
          )
        ];
      }

      const sectie = document.createElement('div');
      sectie.className = 'positie-groep';
      sectie.innerHTML = `<div class="positie-groep-header">${catLabel}</div>`;

      const lijst = document.createElement('div');
      lijst.className = 'positie-lijst';
      lijst.dataset.categorie = cat;

      for (const entry of volgorde) {
        const isEigen = entry.type === 'gast' && entry.fgId === sessie.id;
        const isAnder = !isEigen;

        let naam, meta, ts;
        if (entry.type === 'eigen') {
          naam = entry.map;
          meta = 'Andreas Luckfiel';
        } else {
          const fg = fgById[entry.fgId];
          naam = entry.map;
          meta = fg ? fg.naam : 'Fotograaf';
          // Zoek ts van deze map
          const mapMeta = (fg?.mappen || []).find(m => m.map === entry.map);
          ts = mapMeta?.ts;
        }

        const item = document.createElement('div');
        item.className = 'positie-item ' + (isEigen ? 'eigen' : 'ander');
        item.dataset.type  = entry.type;
        item.dataset.map   = entry.map;
        item.dataset.fgId  = entry.fgId || '';
        item.dataset.fgCat = entry.fgCat || cat;
        item.innerHTML = `
          ${isEigen ? '<span class="drag-handle">⠿</span>' : '<span style="width:1.3rem;flex-shrink:0"></span>'}
          <span class="positie-naam" title="${naam}">${naam}</span>
          <span class="positie-meta">${meta}${ts ? ' · ' + fmtDatum(ts) : ''}</span>`;
        lijst.appendChild(item);
      }

      // Eigen mappen die nog niet in de volgorde staan → achteraan
      const eigenInVolgorde = new Set(volgorde.filter(e => e.type === 'gast' && e.fgId === sessie.id).map(e => e.map));
      const eigenMappen = (_mappenData || []).filter(m => (m.categorie === cat || (cat === 'voetbal' && m.categorie === 'eigen')) && !eigenInVolgorde.has(m.map));
      for (const m of eigenMappen) {
        const item = document.createElement('div');
        item.className = 'positie-item eigen';
        item.dataset.type  = 'gast';
        item.dataset.map   = m.map;
        item.dataset.fgId  = sessie.id;
        item.dataset.fgCat = m.categorie;
        item.innerHTML = `
          <span class="drag-handle">⠿</span>
          <span class="positie-naam" title="${m.map}">${m.map}</span>
          <span class="positie-meta">${sessie.naam}${m.ts ? ' · ' + fmtDatum(m.ts) : ''}</span>`;
        lijst.appendChild(item);
      }

      new Sortable(lijst, {
        animation: 200,
        handle: '.drag-handle',
        filter: '.ander',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() { document.getElementById('positie-feedback').textContent = ''; }
      });

      sectie.appendChild(lijst);
      wrapper.appendChild(sectie);
    }

    inhoud.innerHTML = '';
    inhoud.appendChild(wrapper);
    acties.style.display = 'flex';
  } catch(e) {
    inhoud.innerHTML = '<p style="color:#ef4444">Fout: ' + e.message + '</p>';
  }
}

function fmtDatum(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}

window.slaPositieOp = async () => {
  const btn = document.getElementById('btn-positie-opslaan');
  const fb  = document.getElementById('positie-feedback');
  btn.disabled = true; btn.textContent = 'Opslaan…';

  try {
    for (const cat of ['voetbal', 'nosports']) {
      const lijst = document.querySelector(`.positie-lijst[data-categorie="${cat}"]`);
      if (!lijst) continue;

      const volgorde = Array.from(lijst.querySelectorAll('.positie-item')).map(el => {
        if (el.dataset.type === 'eigen') return { type: 'eigen', map: el.dataset.map };
        return { type: 'gast', fgId: el.dataset.fgId, fgCat: el.dataset.fgCat, map: el.dataset.map };
      });

      const res = await fetch(WORKER + '/fotograaf/gallery-volgorde', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
        body: JSON.stringify({ categorie: cat, volgorde }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Fout');
    }
    fb.textContent = '✓ Positie opgeslagen';
    fb.style.color = '#22c55e';
  } catch(e) {
    fb.textContent = '✕ ' + e.message;
    fb.style.color = '#ef4444';
  }
  btn.disabled = false; btn.textContent = 'Positie opslaan';
};

window.uitloggen = () => {
  localStorage.removeItem('zl_fotograaf');
  sessie = null;
  toonInloggen();
};

window.verwijderAccount = async () => {
  if (!confirm('Weet je het zeker?\n\nJe account én alle geüploade foto\'s worden permanent verwijderd.\nDit kan niet ongedaan worden gemaakt.')) return;
  if (!confirm('Laatste kans — echt alles verwijderen?')) return;

  const btn = document.querySelector('[onclick="verwijderAccount()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Bezig…'; }

  try {
    const res  = await fetch(WORKER + '/fotograaf/delete-account', {
      method: 'POST',
      headers: { 'X-Fotograaf-Token': sessie.token },
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Onbekende fout');

    localStorage.removeItem('zl_fotograaf');
    sessie = null;

    // Toon bevestiging
    document.getElementById('main-content').innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:3rem;margin-bottom:1rem">✓</div>
        <h2 style="margin-bottom:0.5rem">Account verwijderd</h2>
        <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem">Je account en alle foto's zijn verwijderd.</p>
        <a href="index.html" style="display:inline-block;background:var(--accent);color:#fff;padding:0.7rem 1.5rem;border-radius:var(--radius);font-weight:700;text-decoration:none">← Terug naar de site</a>
      </div>`;
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🗑 Mijn account en foto\'s verwijderen'; }
    alert('Fout bij verwijderen: ' + e.message);
  }
};
