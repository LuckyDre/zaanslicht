let _mappenData = []; // huidige volgorde
let _fotoVolgorde = {}; // handmatige foto-volgorde per map: { mapNaam: [keys...] }

// Sorteert een foto-array volgens een opgeslagen key-volgorde.
// Keys zonder positie (nieuwe uploads) blijven achteraan in bestandsnaam-volgorde.
function sorteerOpVolgorde(fotos, volgorde) {
  if (!Array.isArray(volgorde) || !volgorde.length) return fotos;
  const pos = new Map(volgorde.map((k, i) => [k, i]));
  return [...fotos].sort((a, b) =>
    (pos.has(a.key) ? pos.get(a.key) : Infinity) - (pos.has(b.key) ? pos.get(b.key) : Infinity));
}

async function laadMappenTab() {
  if (!sessie) return;
  const inhoud = document.getElementById('mappen-inhoud');
  const acties = document.getElementById('mappen-acties');

  // Selectie leegmaken vóór het hertekenen: de checkboxes worden zo opnieuw en
  // leeg opgebouwd, maar de _selMappen/_selFotos-Sets bleven anders gevuld met de
  // oude keuze. Dat gaf o.a. "2 series verwijderen" terwijl er nog maar 1 map
  // aangevinkt was (gemeld door Jan). fgUpdateBulkBalk() verbergt daarna de balk.
  _selMappen.clear();
  _selFotos.clear();
  fgUpdateBulkBalk();

  inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Laden…</p>';
  acties.style.display = 'none';

  try {
    const [manifestRes, fotosRes] = await Promise.all([
      fetch(WORKER + '/fotograaf/manifest'),
      fetch(WORKER + '/fotograaf/fotos?id=' + sessie.id, { headers: { 'X-Fotograaf-Token': sessie.token } }),
    ]);
    const manifestData = await manifestRes.json();
    const fotosData    = await fotosRes.json();

    const verborgenRes = await fetch(WORKER + '/fotograaf/verborgen-eigen', { headers: { 'X-Fotograaf-Token': sessie.token } });
    const verborgenData = verborgenRes.ok ? await verborgenRes.json() : {};
    const verborgenSet = new Set(verborgenData.verborgenMappen || []);

    const fg = (manifestData.fotografen || []).find(f => f.id === sessie.id);
    _mappenData = fg?.mappen || [];

    const handleiding = document.getElementById('handleiding-intro');
    if (handleiding) handleiding.style.display = _mappenData.length > 0 ? 'none' : 'block';

    if (!_mappenData.length) {
      inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Je hebt nog geen mappen aangemaakt. Upload foto\'s om een map te starten.</p>';
      return;
    }

    // Groepeer fotos per mapnaam
    const alleFotos = fotosData.fotos || [];
    _fotoVolgorde = fotosData.fotoVolgorde || {};
    const fotoPerMap = {};
    for (const f of alleFotos) {
      if (f.key.includes('/profiel.')) continue;
      const delen = decodeURIComponent(f.key).split('/');
      if (delen.length < 5) continue;
      const mapNaam = delen[3];
      if (!fotoPerMap[mapNaam]) fotoPerMap[mapNaam] = [];
      fotoPerMap[mapNaam].push(f);
    }
    // Pas handmatige foto-volgorde toe (nieuwe foto's zonder positie komen achteraan)
    for (const mapNaam of Object.keys(fotoPerMap)) {
      fotoPerMap[mapNaam] = sorteerOpVolgorde(fotoPerMap[mapNaam], _fotoVolgorde[mapNaam]);
    }

    // Bouw een map-item element
    function maakMapItem(m, fotos, verborgenSet) {
      const isLeeg   = fotos.length === 0;
      const isVerborgen = verborgenSet ? verborgenSet.has(m.map) : false;
      const thumbSrc = fotos.length > 0 ? `${WORKER}/foto/${fotos[0].key}` : null;
      const li = document.createElement('div');
      li.className = 'map-item' + (isLeeg ? ' leeg' : '') + (isVerborgen ? ' verborgen-serie' : '');
      li.dataset.map = m.map;
      li.dataset.categorie = m.categorie;
      li.dataset.ts = m.ts || 0;

      const escMap = m.map.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      // Bepaal pagina-flags met backwards-compat fallback op categorie
      const opVoetbal    = m.opVoetbal   !== undefined ? m.opVoetbal   : (m.categorie === 'voetbal');
      const opNosports   = m.opNosports  !== undefined ? m.opNosports  : (m.categorie === 'nosports');
      const opOthersports = m.opOthersports === true;
      const opEigenPagina = m.opEigenPagina !== false;
      li.innerHTML = `
        <div class="map-header">
          <input type="checkbox" class="map-checkbox" data-map="${m.map.replace(/"/g,'&quot;')}"
            onclick="event.stopPropagation();fgToggleMapSelectie(this)" title="Selecteer serie" />
          <span class="map-drag-handle" title="Sleep om te sorteren">⠿</span>
          ${thumbSrc
            ? `<img class="map-thumb" src="${thumbSrc}" alt="" />`
            : `<div class="map-thumb-leeg">📁</div>`}
          <div class="map-info">
            <div class="map-naam" title="${m.map}">${m.map}</div>
            <div class="map-meta">${isLeeg
              ? '<span style="color:#ef4444">⚠ Geen foto\'s — niet zichtbaar op de site</span>'
              : `${fotos.length} foto${fotos.length !== 1 ? '\'s' : ''}`}
            </div>
          </div>
          <div class="map-controls">
            <div class="map-cat-knoppen">
              <button class="map-cat-btn${opVoetbal    ? ' actief' : ''}" onclick="toggleMapPagina('${escMap}','voetbal',this)"   title="Tonen op voetbalpagina">⚽ Voetbal</button>
              <button class="map-cat-btn${opNosports   ? ' actief' : ''}" onclick="toggleMapPagina('${escMap}','nosports',this)"  title="Tonen op No Sports pagina">🌿 No Sports</button>
              <button class="map-cat-btn${opOthersports ? ' actief' : ''}" onclick="toggleMapPagina('${escMap}','othersports',this)" title="Tonen op Other Sports pagina">🏅 Other Sports</button>
              <button class="map-cat-btn${opEigenPagina ? ' actief' : ''}" onclick="toggleMapPagina('${escMap}','eigen',this)"    title="Tonen op jouw eigen pagina">🏠 Eigen</button>
            </div>
            <input type="date" class="map-datum-input" value="${m.datum || ''}" title="Datum van deze serie"
              style="background:#111;border:1px solid #333;border-radius:6px;color:#ccc;padding:0.3rem 0.5rem;font-size:0.78rem;color-scheme:dark;font-family:inherit"
              onclick="event.stopPropagation()"
              onchange="slaMapDatumOp('${m.map.replace(/'/g,"\\'")}', this)" />
            <button class="map-verberg-btn${isVerborgen ? ' verborgen' : ''}"
              onclick="toggleMapVerborg('${m.map.replace(/'/g,"\\'")}', this)"
              title="${isVerborgen ? 'Serie verborgen — klik om te tonen' : 'Serie verbergen voor bezoekers'}">${isVerborgen ? '👁 Toon' : '🙈 Verberg'}</button>
            <button class="map-expand-btn" title="Foto's bekijken" onclick="toggleMapFotos(this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
              </svg>
            </button>
          </div>
        </div>
        <div class="map-fotos-paneel">
          <div class="map-fotos-paneel-acties" style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem;flex-wrap:wrap">
            <button class="groep-selecteer-btn" onclick="fgSelecteerAlleFotos('${m.map.replace(/'/g,"\\'")}', this)">Selecteer alles</button>
            <button class="groep-selecteer-btn deselecteer-btn" style="display:none" onclick="fgDeselecteerAlleFotos('${m.map.replace(/'/g,"\\'")}', this)">✕ Deselecteer alles</button>
            <button class="groep-selecteer-btn sorteer-modus-btn" onclick="toggleSorteerModus(this)">🔀 Volgorde wijzigen</button>
            <button class="groep-selecteer-btn foto-volgorde-btn" style="display:none;border-color:var(--orange);color:var(--orange)"
              onclick="slaFotoVolgordeOp('${m.map.replace(/'/g,"\\'")}', this)">💾 Foto-volgorde opslaan</button>
            <span class="foto-selectie-tel" style="font-size:0.75rem;color:#666"></span>
            <span class="sorteer-hint" style="font-size:0.72rem;color:#666;margin-left:auto">Klik 🔀 om de foto-volgorde voor je eigen pagina te wijzigen</span>
          </div>
          <div class="map-fotos-grid"></div>
          <div style="display:flex;gap:0.6rem;margin-top:0.6rem;flex-wrap:wrap">
            <button class="map-verwijder-btn" onclick="verwijderMap('${m.map.replace(/'/g,"\\'")}', ${fotos.length})">
              🗑 ${isLeeg ? 'Lege map verwijderen' : 'Hele map verwijderen'}
            </button>
          </div>
        </div>`;

      const grid = li.querySelector('.map-fotos-grid');
      for (const f of fotos) {
        const naam = decodeURIComponent(f.key.split('/').pop());
        const escapedKey = f.key.replace(/'/g,"\\'");
        const chip = document.createElement('div');
        chip.className = 'foto-chip';
        chip.title = naam;
        chip.dataset.fotoKey = f.key;
        chip.innerHTML = `
          <input type="checkbox" class="foto-chip-check" data-key="${f.key.replace(/"/g,'&quot;')}"
            onclick="event.stopPropagation();fgToggleFotoSelectie(this,'${m.map.replace(/'/g,"\\'")}')" />
          <div class="foto-chip-img">
            <img src="${WORKER}/foto/${f.key}" loading="lazy" alt="${naam}" />
          </div>
          <div class="foto-chip-del" onclick="verwijderFoto('${escapedKey}', this)" title="Verwijder ${naam}">🗑</div>
          <div class="foto-chip-lbl" onclick="openFotoLabelPopup('${escapedKey}', this)" title="Labels">🏷</div>`;
        grid.appendChild(chip);
        // Laad bestaande labels asynchroon
        laadFotoLabelBadge(chip, f.key);
      }
      // Foto's versleepbaar maken; na een sleep verschijnt de opslaan-knop.
      // Op touch: lange druk (250ms) start de sleep, zodat gewoon scrollen blijft werken.
      const toonVolgordeKnop = () => {
        const knop = li.querySelector('.foto-volgorde-btn');
        if (knop) { knop.style.display = ''; knop.textContent = '💾 Foto-volgorde opslaan'; knop.disabled = false; }
      };
      if (fotos.length > 1) {
        new Sortable(grid, {
          animation: 150,
          handle: '.foto-chip-img',
          delay: 250,
          delayOnTouchOnly: true,
          touchStartThreshold: 4,
          onEnd: toonVolgordeKnop,
        });
        // Tik-tik sorteren (mobiel-vriendelijk alternatief voor slepen):
        // in sorteer-modus tik je eerst een foto, daarna de foto op de doelplek.
        grid.addEventListener('click', e => {
          if (!li.classList.contains('sorteer-modus')) return;
          const chip = e.target.closest('.foto-chip');
          if (!chip) return;
          const sel = grid.querySelector('.foto-chip.sorteer-geselecteerd');
          if (!sel) { chip.classList.add('sorteer-geselecteerd'); return; }
          if (sel === chip) { chip.classList.remove('sorteer-geselecteerd'); return; }
          const alle = [...grid.querySelectorAll('.foto-chip')];
          if (alle.indexOf(sel) < alle.indexOf(chip)) chip.after(sel); else chip.before(sel);
          sel.classList.remove('sorteer-geselecteerd');
          toonVolgordeKnop();
        });
      }
      return li;
    }

    const wrapper = document.createElement('div');
    wrapper.id = 'mappen-sorteer-lijst';

    const sectie = document.createElement('div');
    sectie.className = 'map-groep';
    sectie.innerHTML = `
      <div class="map-groep-header">
        <span>📁 Mijn series</span>
        <span class="map-groep-teller">${_mappenData.length} serie${_mappenData.length !== 1 ? 's' : ''}</span>
        <button class="groep-selecteer-btn" onclick="fgSelecteerAlleMappen()">Selecteer alles</button>
      </div>
      <div class="map-groep-lijst"></div>`;

    const lijst = sectie.querySelector('.map-groep-lijst');
    for (const m of _mappenData) {
      lijst.appendChild(maakMapItem(m, fotoPerMap[m.map] || [], verborgenSet));
    }

    if (_mappenData.length === 0) {
      lijst.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0;font-style:italic">Nog geen mappen — upload je eerste foto\'s!</p>';
    }

    new Sortable(lijst, {
      animation: 200,
      handle: '.map-drag-handle',
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd() { document.getElementById('volgorde-feedback').textContent = ''; }
    });

    wrapper.appendChild(sectie);

    inhoud.innerHTML = '';
    inhoud.appendChild(wrapper);
    acties.style.display = 'flex';

  } catch (e) {
    inhoud.innerHTML = '<p style="color:#ef4444;font-size:0.85rem">Kon mappen niet laden: ' + e.message + '</p>';
  }
}

window.slaMapDatumOp = async function(mapNaam, input) {
  const oudeRand = input.style.borderColor;
  try {
    const res  = await fetch(WORKER + '/fotograaf/map-datum', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ map: mapNaam, datum: input.value }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Fout');
    // Lokale cache bijwerken zodat volgorde-opslaan de datum niet kwijtraakt
    const entry = _mappenData.find(m => m.map === mapNaam);
    if (entry) { if (input.value) entry.datum = input.value; else delete entry.datum; }
    input.style.borderColor = '#22c55e';
    setTimeout(() => { input.style.borderColor = oudeRand || '#333'; }, 1500);
  } catch (e) {
    input.style.borderColor = '#ef4444';
    alert('Datum opslaan mislukt: ' + e.message);
  }
};

function toggleMapFotos(btn) {
  const paneel = btn.closest('.map-item').querySelector('.map-fotos-paneel');
  const open   = paneel.style.display === 'block';
  paneel.style.display = open ? 'none' : 'block';
  btn.classList.toggle('open', !open);
}

window.toggleMapPagina = async function(mapNaam, pagina, btn) {
  const wordtAan = !btn.classList.contains('actief');
  const sessie = haalSessieOp();
  if (!sessie) return;
  btn.disabled = true;
  const payload = {};
  if (pagina === 'voetbal')  payload.opVoetbal    = wordtAan;
  if (pagina === 'nosports') payload.opNosports   = wordtAan;
  if (pagina === 'eigen')    payload.opEigenPagina = wordtAan;
  payload.map = mapNaam;
  try {
    const r = await fetch(WORKER + '/fotograaf/map-paginas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error('Fout');
    btn.classList.toggle('actief', wordtAan);
  } catch(e) {
    alert('Kon pagina-instelling niet opslaan.');
  }
  btn.disabled = false;
};

window.toggleSorteerModus = function(btn) {
  const li = btn.closest('.map-item');
  const actief = li.classList.toggle('sorteer-modus');
  btn.textContent = actief ? '✔ Klaar met sorteren' : '🔀 Volgorde wijzigen';
  btn.style.borderColor = actief ? 'var(--orange)' : '';
  btn.style.color = actief ? 'var(--orange)' : '';
  const hint = li.querySelector('.sorteer-hint');
  if (hint) hint.textContent = actief
    ? 'Tik een foto en tik daarna de plek waar hij moet staan (slepen kan ook)'
    : 'Klik 🔀 om de foto-volgorde voor je eigen pagina te wijzigen';
  if (!actief) li.querySelectorAll('.foto-chip.sorteer-geselecteerd').forEach(c => c.classList.remove('sorteer-geselecteerd'));
};

window.slaFotoVolgordeOp = async function(mapNaam, btn) {
  const s = haalSessieOp(); if (!s) return;
  const li = btn.closest('.map-item');
  const keys = [...li.querySelectorAll('.foto-chip')].map(c => c.dataset.fotoKey);
  btn.disabled = true; btn.textContent = 'Opslaan…';
  try {
    const res = await fetch(WORKER + '/fotograaf/foto-volgorde', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
      body: JSON.stringify({ map: mapNaam, volgorde: keys }),
    });
    if (res.status === 401) { sessieVerlopen(); return; }
    if (!res.ok) throw new Error(`Opslaan mislukt (${res.status})`);
    _fotoVolgorde[mapNaam] = keys;
    btn.textContent = '✓ Opgeslagen';
    setTimeout(() => { btn.style.display = 'none'; }, 1800);
  } catch (e) {
    alert(e.message);
    btn.textContent = '💾 Foto-volgorde opslaan';
    btn.disabled = false;
  }
};

async function verwijderFoto(key, delBtn) {
  const chip = delBtn.closest('.foto-chip');
  if (!confirm('Deze foto van de site verwijderen?')) return;
  delBtn.innerHTML = '…';
  try {
    const res  = await fetch(WORKER + '/fotograaf/foto-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ key }),
    });
    if (res.status === 401) { sessieVerlopen(); return; }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Fout');
    chip.remove();
    // Update teller
    const mapItem = document.querySelector(`[data-map="${decodeURIComponent(key).split('/')[3]}"]`);
    if (mapItem) {
      const grid  = mapItem.querySelector('.map-fotos-grid');
      const count = grid.querySelectorAll('.foto-chip').length;
      const meta  = mapItem.querySelector('.map-meta');
      if (count === 0) {
        meta.innerHTML = '<span style="color:#ef4444">⚠ Geen foto\'s — niet zichtbaar op de site</span>';
        mapItem.classList.add('leeg');
        mapItem.querySelector('.map-verwijder-btn').textContent = '🗑 Lege map verwijderen';
      } else {
        meta.textContent = `${count} foto${count !== 1 ? "'s" : ""}`;
      }
    }
  } catch (e) {
    alert('Verwijderen mislukt: ' + e.message);
    delBtn.innerHTML = '🗑';
  }
}

// Verwijderen gaat foto-voor-foto; bij grote series (Jan had er een van 361) duurt
// dat minuten waarin er zonder deze indicator niets zichtbaar gebeurt — het leek
// hangen. Toont een vaste voortgangsbalk onderin.
function toonVerwijderVoortgang(huidig, totaal, wat) {
  let el = document.getElementById('verwijder-voortgang');
  if (!el) {
    el = document.createElement('div');
    el.id = 'verwijder-voortgang';
    el.style.cssText = 'position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:700;background:#1a1a1a;border:1px solid var(--accent);color:#fff;padding:0.7rem 1.2rem;border-radius:10px;font-size:0.85rem;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5)';
    document.body.appendChild(el);
  }
  el.textContent = `🗑 ${wat} verwijderen… ${huidig} van ${totaal}`;
}
function verbergVerwijderVoortgang() {
  document.getElementById('verwijder-voortgang')?.remove();
}

async function verwijderMap(mapNaam, aantalFotos) {
  const vraag = aantalFotos > 0
    ? `Weet je zeker dat je "${mapNaam}" wilt verwijderen?\n\nAlle ${aantalFotos} foto's worden permanent van de site verwijderd.`
    : `Lege map "${mapNaam}" verwijderen?`;
  if (!confirm(vraag)) return;

  try {
    // Haal alle foto-keys van deze map op en verwijder ze één voor één
    const res   = await fetch(WORKER + '/fotograaf/fotos?id=' + sessie.id, { headers: { 'X-Fotograaf-Token': sessie.token } });
    const data  = await res.json();
    const fotos = (data.fotos || []).filter(f => {
      try { return decodeURIComponent(f.key).split('/')[3] === mapNaam; } catch { return false; }
    });

    let g = 0;
    for (const f of fotos) {
      toonVerwijderVoortgang(++g, fotos.length, 'Serie');
      const delRes = await fetch(WORKER + '/fotograaf/foto-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
        body: JSON.stringify({ key: f.key }),
      });
      if (delRes.status === 401) { sessieVerlopen(); return; }
      if (!delRes.ok) throw new Error(`Foto verwijderen mislukt (${delRes.status})`);
    }

    // Verwijder map uit de mappen-lijst in KV
    const nieuweMappen = _mappenData.filter(m => m.map !== mapNaam);
    const volgordeRes = await fetch(WORKER + '/fotograaf/mappen-volgorde', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': sessie.token },
      body: JSON.stringify({ mappen: nieuweMappen }),
    });
    if (volgordeRes.status === 401) { sessieVerlopen(); return; }
    if (!volgordeRes.ok) throw new Error(`Map bijwerken mislukt (${volgordeRes.status})`);

    // Herlaad de tab
    await laadMappenTab();
  } catch (e) {
    alert('Verwijderen mislukt: ' + e.message);
  } finally {
    verbergVerwijderVoortgang();
  }
}

const _selMappen = new Set();
const _selFotos  = new Map(); // mapNaam → Set<key>

function fgUpdateBulkBalk() {
  const balk = document.getElementById('fg-bulk-balk');
  const tel  = document.getElementById('fg-bulk-tel');
  const fotoTotaal = [..._selFotos.values()].reduce((a, s) => a + s.size, 0);
  const mapAantal  = _selMappen.size;

  if (mapAantal > 0) {
    tel.textContent = `${mapAantal} serie${mapAantal !== 1 ? 's' : ''} geselecteerd`;
    document.getElementById('fg-bulk-verberg').style.display = '';
    document.getElementById('fg-bulk-toon').style.display = 'none';
    document.getElementById('fg-bulk-label').style.display = 'none';
    document.getElementById('fg-bulk-del').style.display = '';
    balk.classList.add('actief');
  } else if (fotoTotaal > 0) {
    tel.textContent = `${fotoTotaal} foto${fotoTotaal !== 1 ? "'s" : ''} geselecteerd`;
    document.getElementById('fg-bulk-verberg').style.display = 'none';
    document.getElementById('fg-bulk-toon').style.display = 'none';
    document.getElementById('fg-bulk-label').style.display = '';
    document.getElementById('fg-bulk-del').style.display = '';
    balk.classList.add('actief');
  } else {
    balk.classList.remove('actief');
  }
}

window.fgToggleMapSelectie = function(cb) {
  const mapNaam = cb.dataset.map;
  if (cb.checked) _selMappen.add(mapNaam);
  else _selMappen.delete(mapNaam);
  cb.closest('.map-item').classList.toggle('geselecteerd', cb.checked);
  fgUpdateBulkBalk();
};

window.fgSelecteerAlleMappen = function() {
  const lijst = document.querySelector('.map-groep-lijst');
  if (!lijst) return;
  const cbs = lijst.querySelectorAll('.map-checkbox');
  const alleAan = [...cbs].every(c => c.checked);
  cbs.forEach(c => {
    c.checked = !alleAan;
    const naam = c.dataset.map;
    if (!alleAan) _selMappen.add(naam); else _selMappen.delete(naam);
    c.closest('.map-item').classList.toggle('geselecteerd', !alleAan);
  });
  fgUpdateBulkBalk();
};

// Teller + zichtbaarheid van de "✕ Deselecteer alles"-knop bijwerken voor één paneel
function fgUpdatePaneelSelectie(paneel) {
  const n = paneel.querySelectorAll('.foto-chip-check:checked').length;
  const telEl = paneel.querySelector('.foto-selectie-tel');
  if (telEl) telEl.textContent = n > 0 ? `${n} geselecteerd` : '';
  const deselBtn = paneel.querySelector('.deselecteer-btn');
  if (deselBtn) deselBtn.style.display = n > 0 ? '' : 'none';
}

window.fgToggleFotoSelectie = function(cb, mapNaam) {
  const key = cb.dataset.key;
  if (!_selFotos.has(mapNaam)) _selFotos.set(mapNaam, new Set());
  const set = _selFotos.get(mapNaam);
  if (cb.checked) set.add(key); else set.delete(key);
  if (set.size === 0) _selFotos.delete(mapNaam);
  cb.closest('.foto-chip').classList.toggle('geselecteerd', cb.checked);
  const paneel = cb.closest('.map-fotos-paneel');
  if (paneel) fgUpdatePaneelSelectie(paneel);
  fgUpdateBulkBalk();
};

window.fgSelecteerAlleFotos = function(mapNaam, btn) {
  const paneel = btn.closest('.map-fotos-paneel');
  const cbs = paneel.querySelectorAll('.foto-chip-check');
  const alleAan = [...cbs].every(c => c.checked);
  if (!_selFotos.has(mapNaam)) _selFotos.set(mapNaam, new Set());
  const set = _selFotos.get(mapNaam);
  cbs.forEach(c => {
    c.checked = !alleAan;
    if (!alleAan) set.add(c.dataset.key); else set.delete(c.dataset.key);
    c.closest('.foto-chip').classList.toggle('geselecteerd', !alleAan);
  });
  if (set.size === 0) _selFotos.delete(mapNaam);
  fgUpdatePaneelSelectie(paneel);
  fgUpdateBulkBalk();
};

window.fgDeselecteerAlleFotos = function(mapNaam, btn) {

  });

  fgUpdateBulkBalk();
};

async function fgBulkVerberg() {
  if (_selMappen.size === 0) return;
  const s = haalSessieOp(); if (!s) return;
  for (const mapNaam of _selMappen) {
    await fetch(WORKER + '/fotograaf/eigen-verberg-map', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
      body: JSON.stringify({ map: mapNaam, verborgen: true }),
    });
    _updateVerbergUI(mapNaam, true);
  }
  fgBulkAnnuleer();
}

async function fgBulkToon() {
  if (_selMappen.size === 0) return;
  const s = haalSessieOp(); if (!s) return;
  for (const mapNaam of _selMappen) {
    await fetch(WORKER + '/fotograaf/eigen-verberg-map', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
      body: JSON.stringify({ map: mapNaam, verborgen: false }),
    });
    _updateVerbergUI(mapNaam, false);
  }
  fgBulkAnnuleer();
}

function _updateVerbergUI(mapNaam, verborgen) {
  document.querySelectorAll('.map-item').forEach(el => {
    if (el.dataset.map !== mapNaam) return;
    el.classList.toggle('verborgen-serie', verborgen);

      btn.classList.toggle('verborgen', verborgen);

    }

}

async function fgBulkVerwijder() {
  const s = haalSessieOp(); if (!s) return;

  if (_selMappen.size > 0) {
    const n = _selMappen.size;
    if (!confirm(`${n} serie${n !== 1 ? 's' : ''} verwijderen inclusief alle foto's?\nDeze actie kan niet ongedaan worden gemaakt.`)) return;
    try {
      for (const mapNaam of [..._selMappen]) {
        await _verwijderMapStil(mapNaam, s);
      }
      fgBulkAnnuleer();
    } catch (e) {
      if (e.message !== 'sessie-verlopen') alert('Verwijderen mislukt: ' + e.message);
    } finally {
      verbergVerwijderVoortgang();
    }
    return;
  }

  const alleKeys = [];
  for (const set of _selFotos.values()) for (const k of set) alleKeys.push(k);
  if (alleKeys.length === 0) return;
  if (!confirm(`${alleKeys.length} foto${alleKeys.length !== 1 ? "'s" : ''} verwijderen?\nDeze actie kan niet ongedaan worden gemaakt.`)) return;

  try {
    let g = 0;
    for (const key of alleKeys) {
      toonVerwijderVoortgang(++g, alleKeys.length, "Foto's");
      const delRes = await fetch(WORKER + '/fotograaf/foto-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
        body: JSON.stringify({ key }),
      });
      if (delRes.status === 401) { sessieVerlopen(); return; }
      if (!delRes.ok) { alert(`Verwijderen mislukt (${delRes.status})`); return; }
      document.querySelectorAll('.foto-chip').forEach(c => {
        if (c.dataset.fotoKey === key) c.remove();
      });
    }
    fgBulkAnnuleer();
  } finally {
    verbergVerwijderVoortgang();
  }
}

async function _verwijderMapStil(mapNaam, s) {
  const res  = await fetch(WORKER + '/fotograaf/fotos?id=' + s.id, { headers: { 'X-Fotograaf-Token': s.token } });
  const data = await res.json();
  const fotos = (data.fotos || []).filter(f => {
    try { return decodeURIComponent(f.key).split('/')[3] === mapNaam; } catch { return false; }
  });
  let g = 0;
  for (const f of fotos) {
    toonVerwijderVoortgang(++g, fotos.length, 'Serie');
    const delRes = await fetch(WORKER + '/fotograaf/foto-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
      body: JSON.stringify({ key: f.key }),
    });
    if (delRes.status === 401) { sessieVerlopen(); throw new Error('sessie-verlopen'); }
    if (!delRes.ok) throw new Error(`Foto verwijderen mislukt (${delRes.status})`);
  }
  const nieuweMappen = _mappenData.filter(m => m.map !== mapNaam);
  const volgordeRes = await fetch(WORKER + '/fotograaf/mappen-volgorde', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Fotograaf-Token': s.token },
    body: JSON.stringify({ mappen: nieuweMappen }),
  });
  if (volgordeRes.status === 401) { sessieVerlopen(); throw new Error('sessie-verlopen'); }
  if (!volgordeRes.ok) throw new Error(`Map bijwerken mislukt (${volgordeRes.status})`);
  _mappenData = nieuweMappen;
  document.querySelectorAll('.map-item').forEach(el => {
    if (el.dataset.map === mapNaam) el.remove();
  });
}

function fgBulkAnnuleer() {
  _selMappen.clear();
  _selFotos.clear();
  document.querySelectorAll('.map-checkbox').forEach(c => {
    c.checked = false;
    c.closest('.map-item')?.classList.remove('geselecteerd');
  });
  document.querySelectorAll('.foto-chip-check').forEach(c => {
    c.checked = false;
    c.closest('.foto-chip')?.classList.remove('geselecteerd');
  });
  document.querySelectorAll('.foto-selectie-tel').forEach(el => el.textContent = '');
  document.querySelectorAll('.deselecteer-btn').forEach(el => el.style.display = 'none');
  fgUpdateBulkBalk();
}

async function laadPositieTab() {
  if (!sessie) return;
  const inhoud = document.getElementById('positie-inhoud');
  const acties = document.getElementById('positie-acties');
  inhoud.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Laden…</p>';
  acties.style.display = 'none';

  try {
    const [volRes, manifestRes] = await Promise.all([
      fetch(WORKER + '/gallery/volgorde'),
      fetch(WORKER + '/fotograaf/manifest'),
    ]);
    const volData      = await volRes.json();
    const manifestData = await manifestRes.json();

    // Bouw een naam-lookup voor alle fotografen
    const fgById = {};
    for (const fg of (manifestData.fotografen || [])) {
      fgById[fg.id] = fg;
    }

    const wrapper = document.createElement('div');

    // Laad ook manifest.json voor eigen (Andreas) series
    let eigenManifest = {};
    try {
      const mr = await fetch('manifest.json?v=' + Date.now());
      eigenManifest = await mr.json();
    } catch {}

    for (const cat of ['voetbal', 'nosports']) {
      const catLabel = cat === 'voetbal' ? '⚽ Voetbal' : '🌿 No Sports';

      // Als er geen opgeslagen volgorde is, bouw een standaard op uit manifest + gast-mappen
      let volgorde = volData[cat];
      if (!volgorde?.length) {
        volgorde = [
          ...(eigenManifest[cat] || []).map(item => ({ type: 'eigen', map: item.map })),
          ...(Object.values(fgById)).flatMap(fg =>
            (fg.mappen || [])
              .filter(m => {
                const opCat = cat === 'voetbal'
                  ? (m.opVoetbal  !== undefined ? m.opVoetbal  : m.categorie === 'voetbal')
                  : (m.opNosports !== undefined ? m.opNosports : m.categorie === 'nosports');
                return opCat;
              })
              .map(m => ({ type: 'gast', fgId: fg.id, fgCat: m.categorie, map: m.map }))
          )
        ];
      }

      const sectie = document.createElement('div');
      sectie.className = 'positie-groep';
      sectie.innerHTML = `<div class="positie-groep-header">${catLabel}</div>`;

      const lijst = document.createElement('div');
      lijst.className = 'positie-lijst';
      lijst.dataset.categorie = cat;

      for (const entry of volgorde) {
        const isEigen = entry.type === 'gast' && entry.fgId === sessie.id;
        const isAnder = !isEigen;

        let naam, meta, ts;
        if (entry.type === 'eigen') {
          naam = entry.map;
          meta = 'Andreas Luckfiel';
        } else {
          const fg = fgById[entry.fgId];
          naam = entry.map;
          meta = fg ? fg.naam : 'Fotograaf';
          // Zoek ts van deze map
          const mapMeta = (fg?.mappen || []).find(m => m.map === entry.map);
          ts = mapMeta?.ts;
        }

        const item = document.createElement('div');
        item.className = 'positie-item ' + (isEigen ? 'eigen' : 'ander');
        item.dataset.type  = entry.type;
        item.dataset.map   = entry.map;
        item.dataset.fgId  = entry.fgId || '';
        item.dataset.fgCat = entry.fgCat || cat;
        item.innerHTML = `
          ${isEigen ? '<span class="drag-handle">⠿</span>' : '<span style="width:1.3rem;flex-shrink:0"></span>'}
          <span class="positie-naam" title="${naam}">${naam}</span>
          <span class="positie-meta">${meta}${ts ? ' · ' + fmtDatum(ts) : ''}</span>`;
        lijst.appendChild(item);
      }

      // Eigen mappen die nog niet in de volgorde staan → achteraan
      const eigenInVolgorde = new Set(volgorde.filter(e => e.type === 'gast' && e.fgId === sessie.id).map(e => e.map));
      const eigenMappen = (_mappenData || []).filter(m => {
        const opCat = cat === 'voetbal'
          ? (m.opVoetbal  !== undefined ? m.opVoetbal  : m.categorie === 'voetbal')
          : (m.opNosports !== undefined ? m.opNosports : m.categorie === 'nosports');
        return opCat && !eigenInVolgorde.has(m.map);
      });
      for (const m of eigenMappen) {
        const item = document.createElement('div');
        item.className = 'positie-item eigen';
        item.dataset.type  = 'gast';
        item.dataset.map   = m.map;
        item.dataset.fgId  = sessie.id;
        item.dataset.fgCat = m.categorie;
        item.innerHTML = `
          <span class="drag-handle">⠿</span>
          <span class="positie-naam" title="${m.map}">${m.map}</span>
          <span class="positie-meta">${sessie.naam}${m.ts ? ' · ' + fmtDatum(m.ts) : ''}</span>`;
        lijst.appendChild(item);
      }

      new Sortable(lijst, {
        animation: 200,
        handle: '.drag-handle',
        filter: '.ander',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() { document.getElementById('positie-feedback').textContent = ''; }
      });

      sectie.appendChild(lijst);
      wrapper.appendChild(sectie);
    }

    inhoud.innerHTML = '';
    inhoud.appendChild(wrapper);
    acties.style.display = 'flex';
  } catch(e) {
    inhoud.innerHTML = '<p style="color:#ef4444">Fout: ' + e.message + '</p>';
  }
}

function fmtDatum(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}

    if (!data.ok) throw new Error(data.error || 'Onbekende fout');

    await stopPresence();
    localStorage.removeItem('zl_fotograaf');
    sessie = null;

    // Toon bevestiging
    document.getElementById('main-content').innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:3rem;margin-bottom:1rem">✓</div>
        <h2 style="margin-bottom:0.5rem">Account verwijderd</h2>
        <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem">Je account en alle foto's zijn verwijderd.</p>
        <a href="index.html" style="display:inline-block;background:var(--accent);color:#fff;padding:0.7rem 1.5rem;border-radius:var(--radius);font-weight:700;text-decoration:none">← Terug naar de site</a>
      </div>`;
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🗑 Mijn account en foto\'s verwijderen'; }
    alert('Fout bij verwijderen: ' + e.message);
  }
};
</script>
